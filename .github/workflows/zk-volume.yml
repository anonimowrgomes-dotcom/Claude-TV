name: Build zk Volume APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar projeto zk Volume limpo
        shell: bash
        run: |
          mkdir -p zkvolume/app/src/main/java/com/zkmods/volumecontrol
          cat > zkvolume/settings.gradle <<'EOF_GRADLE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'zk Volume'
          include ':app'
          EOF_GRADLE

          cat > zkvolume/build.gradle <<'EOF_GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF_GRADLE

          cat > zkvolume/gradle.properties <<'EOF_GRADLE'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF_GRADLE

          cat > zkvolume/app/build.gradle <<'EOF_GRADLE'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.zkmods.volumecontrol'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.zkmods.volumecontrol'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_GRADLE

          cat > zkvolume/app/src/main/AndroidManifest.xml <<'EOF_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <application
                  android:allowBackup="false"
                  android:label="zk Volume 👑"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST

          cat > zkvolume/app/src/main/java/com/zkmods/volumecontrol/MainActivity.java <<'EOF_JAVA'
          package com.zkmods.volumecontrol;

          import android.app.Activity;
          import android.media.AudioManager;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private AudioManager audio;
              private SeekBar slider;
              private TextView value;
              private boolean updating = false;
              private final int bg = Color.rgb(9, 9, 20);
              private final int panel = Color.rgb(23, 22, 43);
              private final int purple = Color.rgb(153, 105, 255);
              private final int white = Color.rgb(247, 245, 255);

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  audio = (AudioManager) getSystemService(AUDIO_SERVICE);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(28, 32, 28, 28);
                  root.setBackgroundColor(bg);
                  TextView title = new TextView(this);
                  title.setText("zk Volume 👑"); title.setTextColor(white);
                  title.setTextSize(28); title.setTypeface(null, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER); root.addView(title);
                  TextView subtitle = new TextView(this);
                  subtitle.setText("CONTROLE DE ÁUDIO"); subtitle.setTextColor(0xFFB7ABCD);
                  subtitle.setTextSize(12); subtitle.setGravity(Gravity.CENTER); root.addView(subtitle);
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL); card.setGravity(Gravity.CENTER);
                  card.setPadding(24, 28, 24, 24); card.setBackground(round(panel, 24));
                  LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(-1, -2);
                  cp.topMargin = 28; root.addView(card, cp);
                  TextView music = new TextView(this); music.setText("♫");
                  music.setTextColor(white); music.setTextSize(40); music.setGravity(Gravity.CENTER); card.addView(music);
                  TextView label = new TextView(this); label.setText("Volume de mídia");
                  label.setTextColor(white); label.setTextSize(20); label.setGravity(Gravity.CENTER); card.addView(label);
                  value = new TextView(this); value.setTextColor(0xFFB7ABCD);
                  value.setGravity(Gravity.CENTER); value.setTextSize(15); card.addView(value);
                  slider = new SeekBar(this); slider.setMax(audio.getStreamMaxVolume(AudioManager.STREAM_MUSIC));
                  card.addView(slider, new LinearLayout.LayoutParams(-1, -2));
                  LinearLayout row = new LinearLayout(this); row.setOrientation(LinearLayout.HORIZONTAL);
                  card.addView(row, new LinearLayout.LayoutParams(-1, -2));
                  Button minus = button("−"), plus = button("+");
                  row.addView(minus, new LinearLayout.LayoutParams(0, 56, 1));
                  LinearLayout.LayoutParams pp = new LinearLayout.LayoutParams(0, 56, 1); pp.leftMargin = 12;
                  row.addView(plus, pp);
                  Button mute = button("Silenciar / ativar som");
                  LinearLayout.LayoutParams mp = new LinearLayout.LayoutParams(-1, 56); mp.topMargin = 14; card.addView(mute, mp);
                  minus.setOnClickListener(v -> change(-1)); plus.setOnClickListener(v -> change(1));
                  mute.setOnClickListener(v -> { int n = audio.getStreamVolume(AudioManager.STREAM_MUSIC); setVolume(n == 0 ? Math.max(1, audio.getStreamMaxVolume(AudioManager.STREAM_MUSIC) / 3) : 0); });
                  slider.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int p, boolean fromUser) { if (fromUser && !updating) setVolume(p); }
                      public void onStartTrackingTouch(SeekBar s) {}
                      public void onStopTrackingTouch(SeekBar s) {}
                  });
                  setContentView(root); refresh();
              }
              private Button button(String text) {
                  Button b = new Button(this); b.setText(text); b.setTextColor(white); b.setTextSize(16);
                  b.setAllCaps(false); b.setBackground(round(purple, 16)); b.setStateListAnimator(null); return b;
              }
              private GradientDrawable round(int color, int radius) {
                  GradientDrawable d = new GradientDrawable(); d.setColor(color); d.setCornerRadius(radius); return d;
              }
              private void change(int delta) { setVolume(audio.getStreamVolume(AudioManager.STREAM_MUSIC) + delta); }
              private void setVolume(int n) {
                  int max = audio.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                  audio.setStreamVolume(AudioManager.STREAM_MUSIC, Math.max(0, Math.min(max, n)), 0); refresh();
              }
              private void refresh() {
                  int max = Math.max(1, audio.getStreamMaxVolume(AudioManager.STREAM_MUSIC));
                  int current = audio.getStreamVolume(AudioManager.STREAM_MUSIC);
                  updating = true; slider.setMax(max); slider.setProgress(current);
                  value.setText(current + " / " + max + " • " + Math.round(current * 100f / max) + "%"); updating = false;
              }
              @Override protected void onResume() { super.onResume(); if (audio != null && slider != null) refresh(); }
          }
          EOF_JAVA

      - name: Compilar APK
        run: gradle -p zkvolume assembleDebug --no-daemon --console=plain

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: zk-volume-debug-apk
          path: zkvolume/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

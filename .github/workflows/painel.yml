              private void moveHeld(int key) {
                  int i = grid.indexOfChild(holding);
                  int n = grid.getChildCount();
                  if (i < 0) return;
                  int j;
                  if (key == KeyEvent.KEYCODE_DPAD_LEFT) j = i - 1;
                  else if (key == KeyEvent.KEYCODE_DPAD_RIGHT) j = i + 1;
                  else if (key == KeyEvent.KEYCODE_DPAD_UP) j = i - COLUMNS;
                  else {
                      j = i + COLUMNS;
                      if (j >= n && i / COLUMNS < (n - 1) / COLUMNS) j = n - 1;
                  }
                  if (j < 0 || j >= n || j == i) return;
                  // Move os outros apps de lugar, e nao o app em foco: o foco nao se perde.
                  if (j > i) {
                      for (int idx = i; idx < j; idx++) {
                          View nb = grid.getChildAt(idx + 1);
                          grid.removeViewAt(idx + 1);
                          grid.addView(nb, idx);
                      }
                  } else {
                      for (int idx = i; idx > j; idx--) {
                          View nb = grid.getChildAt(idx - 1);
                          grid.removeViewAt(idx - 1);
                          grid.addView(nb, idx);
                      }
                  }
                  Apps.Entry moved = orderList.remove(i);
                  orderList.add(j, moved);
                  Apps.saveOrder(this, orderList);
                  keepHeldVisible();
              }

              private void keepHeldVisible() {
                  final View v = holding;
                  if (v == null) return;
                  v.getViewTreeObserver().addOnGlobalLayoutListener(new ViewTreeObserver.OnGlobalLayoutListener() {
                      @Override
                      public void onGlobalLayout() {
                          v.getViewTreeObserver().removeOnGlobalLayoutListener(this);
                          v.requestRectangleOnScreen(new Rect(0, 0, v.getWidth(), v.getHeight()), true);
                      }
                  });
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  if (organize && holding != null) {
                      int k = event.getKeyCode();
                      boolean dirKey = k == KeyEvent.KEYCODE_DPAD_LEFT || k == KeyEvent.KEYCODE_DPAD_RIGHT
                              || k == KeyEvent.KEYCODE_DPAD_UP || k == KeyEvent.KEYCODE_DPAD_DOWN;
                      boolean dropKey = k == KeyEvent.KEYCODE_DPAD_CENTER || k == KeyEvent.KEYCODE_ENTER
                              || k == KeyEvent.KEYCODE_BACK;
                      if (dirKey) {
                          if (event.getAction() == KeyEvent.ACTION_DOWN) moveHeld(k);
                          return true;
                      }
                      if (dropKey) {
                          if (event.getAction() == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0) drop();
                          return true;
                      }
                  }
                  return super.dispatchKeyEvent(event);
              }

              private void addApps() {
                  List<Apps.Entry> list = Apps.all(this);
                  List<String> favs = Apps.favorites(this);
                  LinearLayout row = null;

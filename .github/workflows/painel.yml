                  dockScroll.addView(dock, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  FrameLayout.LayoutParams sl = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, px(tileH) + reflectPx + padV * 2,
                          Gravity.BOTTOM);
                  sl.bottomMargin = px(h * 0.02f);
                  dockScroll.setVisibility(View.GONE);
                  root.addView(dockScroll, sl);

                  // Ponto de foco invisivel: quando os apps somem, o foco fica aqui e nao pula para os botoes de cima.
                  focusAnchor = new View(this);
                  focusAnchor.setFocusable(true);
                  focusAnchor.setDefaultFocusHighlightEnabled(false);
                  root.addView(focusAnchor, new FrameLayout.LayoutParams(
                          px(2), px(2), Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL));

                  setContentView(root);
                  loadWallpaperAtStart();
              }

              private FrameLayout.LayoutParams topRight(float d, float right, float top) {
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          px(d), px(d), Gravity.TOP | Gravity.END);
                  lp.rightMargin = px(right);
                  lp.topMargin = px(top);
                  return lp;
              }


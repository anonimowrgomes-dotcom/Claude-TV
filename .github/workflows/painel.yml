              }

              private void brightnessRow() {
                  LinearLayout item = new LinearLayout(this);
                  item.setOrientation(LinearLayout.VERTICAL);
                  item.setGravity(Gravity.CENTER);
                  item.setPadding(dp(4), dp(5), dp(4), dp(5));

                  FrameLayout bubble = new FrameLayout(this);
                  GradientDrawable bubbleBg = new GradientDrawable();
                  bubbleBg.setShape(GradientDrawable.OVAL);
                  bubbleBg.setColor(0x222B3444);
                  bubbleBg.setStroke(dp(1), 0x333D7BFF);
                  bubble.setBackground(bubbleBg);
                  bubble.addView(new IconView(this, IconView.SUN),
                          new FrameLayout.LayoutParams(dp(28), dp(28), Gravity.CENTER));
                  item.addView(bubble, new LinearLayout.LayoutParams(dp(54), dp(54)));

                  levelText = label("Brilho " + level + "%");
                  levelText.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  levelText.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams captionLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  captionLp.topMargin = dp(4);
                  item.addView(levelText, captionLp);
                  item.setFocusable(true);
                  item.setOnClickListener(v -> showBrightnessOnly());
                  item.setOnKeyListener((v, keyCode, event) -> {
                      if (event.getAction() != KeyEvent.ACTION_DOWN) return false;
                      if (keyCode == KeyEvent.KEYCODE_DPAD_CENTER || keyCode == KeyEvent.KEYCODE_ENTER) {
                          showBrightnessOnly(); return true;
                      }
                      return false;
                  });
                  focusStyle(item);
                  addToPanel(item);
              }

              private void showBrightnessOnly() {
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(0x00000000);
                  LinearLayout control = new LinearLayout(this);
                  control.setOrientation(LinearLayout.VERTICAL);
                  control.setGravity(Gravity.CENTER);
                  control.setPadding(dp(28), dp(18), dp(28), dp(18));
                  control.setBackgroundColor(0x00000000);
                  LinearLayout top = new LinearLayout(this);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.addView(new IconView(this, IconView.SUN), new LinearLayout.LayoutParams(dp(36), dp(36)));
                  TextView title = label("Brilho"); title.setTextSize(TypedValue.COMPLEX_UNIT_SP, 22);
                  LinearLayout.LayoutParams titleLp = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  titleLp.leftMargin = dp(14); top.addView(title, titleLp);
                  TextView percent = label(level + "%"); percent.setTextSize(TypedValue.COMPLEX_UNIT_SP, 20); top.addView(percent);
                  control.addView(top);
                  BarView brightnessBar = new BarView(this);
                  LinearLayout.LayoutParams barLp = new LinearLayout.LayoutParams(dp(420), dp(10)); barLp.topMargin = dp(18);
                  control.addView(brightnessBar, barLp);
                  brightnessBar.setFraction((level - Prefs.MIN_BRIGHTNESS) / (float)(100 - Prefs.MIN_BRIGHTNESS));
                  FrameLayout.LayoutParams cp = new FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL);
                  cp.bottomMargin = dp(42); root.addView(control, cp);
                  setContentView(root);
                  control.setFocusable(true); control.requestFocus();
                  control.setOnKeyListener((v, key, ev) -> {
                      if (ev.getAction() != KeyEvent.ACTION_DOWN) return false;
                      if (key == KeyEvent.KEYCODE_DPAD_LEFT || key == KeyEvent.KEYCODE_DPAD_RIGHT) {
                          setLevel(level + (key == KeyEvent.KEYCODE_DPAD_RIGHT ? STEP : -STEP));
                          percent.setText(level + "%");
                          brightnessBar.setFraction((level - Prefs.MIN_BRIGHTNESS) / (float)(100 - Prefs.MIN_BRIGHTNESS));
                          return true;
                      }
                      if (key == KeyEvent.KEYCODE_BACK || key == KeyEvent.KEYCODE_DPAD_CENTER || key == KeyEvent.KEYCODE_ENTER) { finish(); return true; }
                      return false;
                  });
              }

              private void setLevel(int value) {
                  int v = Math.max(Prefs.MIN_BRIGHTNESS, Math.min(100, value));
                  if (v == level) return;
                  PanelService s = PanelService.instance;
                  if (s == null) {
                      Toast.makeText(this, "Serviço não está ativo", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  level = v;
                  Prefs.saveBrightness(this, level);
                  s.applyBrightness(level);
                  updateLevel();
              }

              private void updateLevel() {
                  levelText.setText("Brilho " + level + "%");
                  if (bar != null) bar.setFraction((level - Prefs.MIN_BRIGHTNESS) / (float) (100 - Prefs.MIN_BRIGHTNESS));
              }

              // No Android 14 o atalho antigo do sistema virou um "stub" que nao faz nada.
              // O caminho que funciona e a acao SLEEP das Configuracoes da TV.
              private void startScreensaver() {
                  Intent i = new Intent("com.google.android.pano.action.SLEEP");
                  i.setClassName("com.android.tv.settings",
                          "com.android.tv.settings.device.display.daydream.DaydreamVoiceAction");
                  if (tryStart(i)) return;
                  if (tryStart(new Intent("com.google.android.pano.action.SLEEP"))) return;
                  Toast.makeText(this, "Não disponível nesta TV", Toast.LENGTH_SHORT).show();
              }

              private boolean tryStart(Intent i) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      startActivity(i);
                      finish();
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private void open(Intent i) {
                  if (!tryStart(i)) {
                      Toast.makeText(this, "Não disponível nesta TV", Toast.LENGTH_SHORT).show();
                  }
              }
          }

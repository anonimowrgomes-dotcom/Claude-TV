          package com.painel.lateral;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.text.SpannableStringBuilder;
          import android.text.Spanned;
          import android.text.style.ForegroundColorSpan;
          import android.text.style.StyleSpan;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextClock;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              // Usado pelo PanelService: com o app aberto, o botao nao abre o painel.
              static boolean visible;

              private static final int CYAN = 0xFF11A5FF;
              private static final int SOFT = 0xFF7FA8E0;

              private TextView status;
              private TextView keysView;
              private AppUi.Card testCard;

              private int dp(int v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v,
                          getResources().getDisplayMetrics());
              }

              private TextView text(String s, int sp, int color, boolean medium) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sp);
                  t.setTextColor(color);
                  t.setTypeface(Typeface.create(medium ? "sans-serif-medium" : "sans-serif", Typeface.NORMAL));
                  t.setIncludeFontPadding(false);
                  return t;
              }

              private CharSequence colored(String label, String value, int color) {
                  SpannableStringBuilder sb = new SpannableStringBuilder(label);
                  int s = sb.length();
                  sb.append(value);
                  sb.setSpan(new ForegroundColorSpan(color), s, sb.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  sb.setSpan(new StyleSpan(Typeface.BOLD), s, sb.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  return sb;
              }

              private View iconBox(int type, int boxDp, int iconDp, int radiusDp) {
                  FrameLayout f = new FrameLayout(this);
                  GradientDrawable g = new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                          new int[]{0xFF2A63E8, 0xFF0B2A80});
                  g.setCornerRadius(dp(radiusDp));
                  g.setStroke(dp(1), 0x553D8BFF);
                  f.setBackground(g);
                  f.addView(new AppUi.Ic(this, type, 0xFFFFFFFF),
                          new FrameLayout.LayoutParams(dp(iconDp), dp(iconDp), Gravity.CENTER));
                  f.setLayoutParams(new LinearLayout.LayoutParams(dp(boxDp), dp(boxDp)));
                  return f;
              }

              private LinearLayout statusRow(int iconType, TextView label) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  LinearLayout.LayoutParams ip = new LinearLayout.LayoutParams(dp(24), dp(24));
                  ip.rightMargin = dp(16);
                  row.addView(new AppUi.Ic(this, iconType, CYAN), ip);
                  row.addView(label);
                  return row;
              }

              private AppUi.Card card(int iconType, String title, String sub, View.OnClickListener l) {
                  AppUi.Card c = new AppUi.Card(this);
                  LinearLayout.LayoutParams ip = new LinearLayout.LayoutParams(dp(50), dp(50));
                  ip.rightMargin = dp(20);
                  c.addView(iconBox(iconType, 50, 28, 14), ip);

                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.addView(text(title, 22, 0xFFFFFFFF, true));
                  TextView s = text(sub, 15, 0xFF5E8FE0, false);
                  s.setPadding(0, dp(4), 0, 0);
                  col.addView(s);
                  c.addView(col, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  c.addView(new AppUi.Ic(this, AppUi.Ic.CHEVRON, 0xFFBFD6FF),
                          new LinearLayout.LayoutParams(dp(24), dp(24)));
                  c.setOnClickListener(l);

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, c.totalHeight(62));
                  lp.leftMargin = -c.bleed();
                  lp.rightMargin = -c.bleed();
                  c.setLayoutParams(lp);
                  return c;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout root = new FrameLayout(this);
                  root.addView(new AppUi.Bg(this), new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  // Painel de vidro
                  FrameLayout glass = new FrameLayout(this);
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(0xB3050C1E);
                  gd.setCornerRadius(dp(26));
                  gd.setStroke(dp(1), 0x401E6BFF);
                  glass.setBackground(gd);
                  FrameLayout.LayoutParams gp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT);
                  gp.setMargins(dp(32), dp(32), dp(32), dp(32));
                  root.addView(glass, gp);

                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setPadding(dp(44), dp(36), dp(44), dp(24));
                  glass.addView(col, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  // Cabecalho
                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  header.addView(iconBox(AppUi.Ic.GEAR, 54, 30, 15));

                  View divider = new View(this);
                  divider.setBackgroundColor(0x66296BDD);
                  LinearLayout.LayoutParams dv = new LinearLayout.LayoutParams(dp(1), dp(46));
                  dv.leftMargin = dp(18);
                  dv.rightMargin = dp(18);
                  header.addView(divider, dv);

                  LinearLayout titles = new LinearLayout(this);
                  titles.setOrientation(LinearLayout.VERTICAL);
                  TextView title = text("", 32, 0xFFFFFFFF, true);
                  title.setText(colored("Painel ", "Lateral", CYAN));
                  titles.addView(title);
                  TextView sub = text("Ferramentas e configurações do painel.", 15, SOFT, false);
                  sub.setPadding(0, dp(4), 0, 0);
                  titles.addView(sub);
                  header.addView(titles);
                  col.addView(header);

                  // Status
                  status = text("", 17, 0xFFE6F0FF, false);
                  keysView = text("", 17, 0xFFE6F0FF, false);
                  LinearLayout r1 = statusRow(AppUi.Ic.SERVICE, status);
                  LinearLayout r2 = statusRow(AppUi.Ic.PIN, keysView);
                  LinearLayout.LayoutParams s1 = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  s1.topMargin = dp(22);
                  col.addView(r1, s1);
                  LinearLayout.LayoutParams s2 = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  s2.topMargin = dp(10);
                  col.addView(r2, s2);

                  TextView hint = text("O botão do controle abre o painel. "
                          + "(setas, OK, Voltar, Home e volume são ignorados).", 14, 0xFF5E8FE0, false);
                  LinearLayout.LayoutParams hp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  hp.leftMargin = dp(40);
                  hp.topMargin = dp(6);
                  col.addView(hint, hp);

                  // Itens
                  testCard = card(AppUi.Ic.MONITOR, "Testar painel", "Verifique se tudo está funcionando.",
                          v -> startActivity(new Intent(this, PanelActivity.class)));
                  LinearLayout.LayoutParams c1 = (LinearLayout.LayoutParams) testCard.getLayoutParams();
                  c1.topMargin = dp(18);
                  col.addView(testCard, c1);

                  AppUi.Card access = card(AppUi.Ic.ACCESS, "Acessibilidade", "Ative as permissões necessárias.",
                          v -> {
                              try {
                                  startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                              } catch (Exception e) {
                                  // tela indisponivel
                              }
                          });
                  LinearLayout.LayoutParams c2 = (LinearLayout.LayoutParams) access.getLayoutParams();
                  c2.topMargin = -dp(8);
                  col.addView(access, c2);

                  AppUi.Card hiddenApps = card(AppUi.Ic.ACCESS, "Apps ocultos", "Gerencie os aplicativos ocultados da lista.",
                          v -> AppsBar.showHiddenApps(this));
                  LinearLayout.LayoutParams hiddenLp = (LinearLayout.LayoutParams) hiddenApps.getLayoutParams();
                  hiddenLp.topMargin = -dp(8);
                  col.addView(hiddenApps, hiddenLp);

                  // Usuario e relogio (canto superior direito)
                  LinearLayout top = new LinearLayout(this);
                  top.setOrientation(LinearLayout.HORIZONTAL);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.addView(text("ramonzk!", 20, 0xFFA9CCFF, true));
                  View d2 = new View(this);
                  d2.setBackgroundColor(0x66335599);
                  LinearLayout.LayoutParams d2p = new LinearLayout.LayoutParams(dp(1), dp(22));
                  d2p.leftMargin = dp(14);
                  d2p.rightMargin = dp(14);
                  top.addView(d2, d2p);
                  TextClock clock = new TextClock(this);
                  clock.setFormat24Hour("HH:mm");
                  clock.setFormat12Hour("HH:mm");
                  clock.setTextSize(TypedValue.COMPLEX_UNIT_SP, 20);
                  clock.setTextColor(0xFFA9CCFF);
                  clock.setTypeface(Typeface.create("sans-serif-medium", Typeface.NORMAL));
                  top.addView(clock);
                  FrameLayout.LayoutParams tp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP | Gravity.END);
                  tp.topMargin = dp(34);
                  tp.rightMargin = dp(44);
                  glass.addView(top, tp);

                  setContentView(root);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  visible = true;
                  refresh();
                  testCard.requestFocus();
              }

              @Override
              protected void onPause() {
                  visible = false;
                  super.onPause();
              }

              private void refresh() {
                  String en = Settings.Secure.getString(getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  boolean on = en != null && en.contains(getPackageName());
                  status.setText(colored("Serviço de acessibilidade: ", on ? "ATIVO" : "desativado",
                          on ? CYAN : 0xFFFF7A7A));

                  StringBuilder sb = new StringBuilder();
                  for (int k : Prefs.keys(this)) {
                      if (sb.length() > 0) sb.append(", ");
                      sb.append(KeyEvent.keyCodeToString(k)).append(" (").append(k).append(")");
                  }
                  keysView.setText(colored("Botão do painel: ", sb.toString(), CYAN));
              }
          }

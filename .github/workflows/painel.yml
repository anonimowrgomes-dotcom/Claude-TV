          package com.painel.lateral;

          import android.content.Context;
          import android.content.Intent;

          final class Screensaver {
              private Screensaver() { }

              // No Android 14 o atalho antigo do sistema virou um "stub" que nao faz nada.
              // O caminho que funciona e a acao SLEEP das Configuracoes da TV (a mesma do botao do painel).
              static boolean start(Context c) {
                  Intent i = new Intent("com.google.android.pano.action.SLEEP");
                  i.setClassName("com.android.tv.settings",
                          "com.android.tv.settings.device.display.daydream.DaydreamVoiceAction");
                  if (tryStart(c, i)) return true;
                  return tryStart(c, new Intent("com.google.android.pano.action.SLEEP"));
              }

              private static boolean tryStart(Context c, Intent i) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      c.startActivity(i);
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }
          }

              static final class Card extends LinearLayout {
                  private final Paint glow = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final GradientDrawable body = new GradientDrawable();
                  private final RectF r = new RectF();
                  private final float pad;
                  private final float radius;
                  private final float d;

                  Card(Context c) {
                      super(c);
                      d = c.getResources().getDisplayMetrics().density;
                      pad = 14f * d;
                      radius = 18f * d;
                      setOrientation(HORIZONTAL);
                      setGravity(Gravity.CENTER_VERTICAL);
                      setFocusable(true);
                      setClickable(true);
                      setWillNotDraw(false);
                      setLayerType(LAYER_TYPE_SOFTWARE, null);
                      setPadding((int) (pad + 18f * d), (int) pad, (int) (pad + 22f * d), (int) pad);
                      glow.setStyle(Paint.Style.STROKE);
                      glow.setStrokeWidth(3f * d);
                      glow.setColor(0xFF1E90FF);
                      glow.setMaskFilter(new BlurMaskFilter(12f * d, BlurMaskFilter.Blur.NORMAL));
                      body.setOrientation(GradientDrawable.Orientation.LEFT_RIGHT);
                  }

                  // Altura total = altura do corpo + margem para o brilho.
                  int totalHeight(int bodyDp) {
                      return (int) (bodyDp * d + 2f * pad);
                  }

                  // Margem negativa para o corpo do card alinhar com o resto do conteudo.
                  int bleed() {
                      return (int) pad;
                  }

                  @Override
                  protected void onFocusChanged(boolean gainFocus, int direction, Rect previouslyFocusedRect) {
                      super.onFocusChanged(gainFocus, direction, previouslyFocusedRect);
                      invalidate();
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      boolean f = isFocused();
                      r.set(pad, pad, getWidth() - pad, getHeight() - pad);
                      if (f) {
                          c.drawRoundRect(r, radius, radius, glow);
                      }
                      body.setCornerRadius(radius);
                      body.setColors(f ? new int[]{0xFF0B3C9E, 0xFF0A2262}
                              : new int[]{0xFF0A1633, 0xFF070F25});
                      body.setStroke((int) Math.max(1f, (f ? 2f : 1f) * d), f ? 0xFF2AA0FF : 0x40336EDD);
                      body.setBounds((int) r.left, (int) r.top, (int) r.right, (int) r.bottom);
                      body.draw(c);
                      super.onDraw(c);
                  }
              }
          }

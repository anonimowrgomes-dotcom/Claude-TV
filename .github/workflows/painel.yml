name: Build Painel Lateral
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Criar projeto
        run: |
          mkdir -p painel/app/src/main/java/com/painel/lateral painel/app/src/main/res/xml painel/app/src/main/res/values
          cat > painel/settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'painel'
          include ':app'
          EOF_FILE
          cat > painel/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_FILE
          cat > painel/gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF_FILE
          cat > painel/app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.painel.lateral'
              compileSdk 34

              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }

              defaultConfig {
                  applicationId 'com.painel.lateral'
                  minSdk 26
                  targetSdk 29
                  versionCode 3
                  versionName '1.3'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_FILE
          cat > painel/app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:icon="@drawable/ic_launcher_zk"
                  android:banner="@drawable/banner_zk"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".PanelActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:launchMode="singleTask"
                      android:taskAffinity=""
                      android:theme="@android:style/Theme.Translucent.NoTitleBar" />

                  <service
                      android:name=".ClockDream"
                      android:exported="true"
                      android:label="Relógio preto"
                      android:permission="android.permission.BIND_DREAM_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.dreams.DreamService" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </service>

                  <service
                      android:name=".PanelService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF_FILE
          cat > painel/app/src/main/res/xml/accessibility_config.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canRequestFilterKeyEvents="true"
              android:notificationTimeout="100"
              android:description="@string/service_description" />
          EOF_FILE
          cat > painel/app/src/main/res/values/strings.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Painel Lateral</string>
              <string name="service_description">Abre o painel lateral quando o botão escolhido do controle é apertado.</string>
          </resources>

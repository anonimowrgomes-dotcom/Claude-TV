              private void openSettings(String action) {
                  try {
                      Intent i = new Intent(action);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (Exception e) {
                      // tela indisponivel
                  }
              }

              @Override
              public boolean dispatchKeyEvent(android.view.KeyEvent event) {
                  int key = event.getKeyCode();
                  boolean down = event.getAction() == android.view.KeyEvent.ACTION_DOWN;

                  // O mesmo aperto de "cima" que escondeu os apps nao pode continuar subindo para os botoes do topo.
                  if (key == android.view.KeyEvent.KEYCODE_DPAD_UP && swallowUp) {
                      if (!down) { swallowUp = false; return true; }
                      if (event.getRepeatCount() > 0) return true;
                      swallowUp = false;
                  }

                  if (down) {
                      // Com a fileira de apps escondida, esquerda/direita não devem
                      // transferir o foco para os botões do topo.
                      if (!dockVisible && !moveMode && focusAnchor != null && focusAnchor.hasFocus()
                              && (key == android.view.KeyEvent.KEYCODE_DPAD_LEFT
                              || key == android.view.KeyEvent.KEYCODE_DPAD_RIGHT)) return true;
                      // Não saia do Wi-Fi pela esquerda nem das Configurações pela direita.
                      if (!dockVisible && !moveMode && wifiButton != null && wifiButton.hasFocus()
                              && key == android.view.KeyEvent.KEYCODE_DPAD_LEFT) return true;
                      if (!dockVisible && !moveMode && gearButton != null && gearButton.hasFocus()
                              && key == android.view.KeyEvent.KEYCODE_DPAD_RIGHT) return true;
                      if (moveMode) {
                          if (key == android.view.KeyEvent.KEYCODE_DPAD_LEFT) { shiftMoving(-1); return true; }
                          if (key == android.view.KeyEvent.KEYCODE_DPAD_RIGHT) { shiftMoving(1); return true; }
                          if (key == android.view.KeyEvent.KEYCODE_DPAD_CENTER || key == android.view.KeyEvent.KEYCODE_ENTER) {
                              if (event.getRepeatCount() == 0) finishMoving();
                              return true;
                          }
                          if (key == android.view.KeyEvent.KEYCODE_BACK) { finishMoving(); return true; }
                          if (key == android.view.KeyEvent.KEYCODE_DPAD_UP || key == android.view.KeyEvent.KEYCODE_DPAD_DOWN) return true;
                      }
                      if (key == android.view.KeyEvent.KEYCODE_DPAD_DOWN && !dockVisible) { showDock(); return true; }
                      // Com os apps na tela, "baixo" nao tem para onde ir: sem isso o foco pulava para o ponto invisivel.
                      if (key == android.view.KeyEvent.KEYCODE_DPAD_DOWN && dockVisible) return true;
                      if (key == android.view.KeyEvent.KEYCODE_DPAD_UP && dockVisible) {
                          hideDock();
                          swallowUp = true;
                          return true;
                      }
                  }
                  return super.dispatchKeyEvent(event);
              }

              private void showDock() {
                  dockVisible = true;
                  dockScroll.setVisibility(View.VISIBLE);
                  arrowHint.setVisibility(View.GONE);
                  if (dock.getChildCount() > 0) dock.getChildAt(0).requestFocus();
              }

              private void hideDock() {
                  // Passa o foco para o ponto invisivel ANTES de esconder, senao o Android joga o foco no botao de configuracoes.
                  if (focusAnchor != null) focusAnchor.requestFocus();
                  dockVisible = false;
                  dockScroll.setVisibility(View.GONE);
                  arrowHint.setVisibility(View.VISIBLE);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  buildDock();
                  if (!dockVisible && !moveMode && focusAnchor != null) focusAnchor.requestFocus();
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  // Home apertado de novo: volta para o primeiro item
                  lastIndex = 0;
                  hideDock();
                  buildDock();
              }

              @Override
              public void onBackPressed() {
                  // ja esta na tela inicial
              }

              private void buildDock() {
                  dock.removeAllViews();
                  visibleApps.clear();
                  float tileH = w * 0.075f;
                  float appW = (w - px(w * 0.024f) - px(w * 0.006f) * 5) / 6f;
                  int gap = px(w * 0.006f);
                  tileWpx = px(appW);
                  gapPx = gap;
                  float radius = w * 0.0095f;
                  int ring = px(w * 0.0018f) + 2;
                  android.content.SharedPreferences prefs = getSharedPreferences("launcher_apps", MODE_PRIVATE);
                  java.util.Set<String> hidden = new java.util.HashSet<>(prefs.getStringSet("hidden", new java.util.HashSet<>()));
                  List<Apps.Entry> installed = Apps.all(this);
                  Map<String, Apps.Entry> byPkg = new HashMap<>();
                  for (Apps.Entry e : installed) byPkg.put(e.pkg, e);
                  List<Apps.Entry> ordered = new ArrayList<>();
                  String saved = prefs.getString("order", "");
                  if (!saved.isEmpty()) for (String pkg : saved.split("\\|")) {
                      Apps.Entry e = byPkg.get(pkg);
                      if (e != null && !hidden.contains(pkg) && !ordered.contains(e)) ordered.add(e);
                  }
                  for (Apps.Entry e : installed) if (!hidden.contains(e.pkg) && !ordered.contains(e)) ordered.add(e);
                  visibleApps.addAll(ordered);
                  for (int i = 0; i < ordered.size(); i++) {
                      final Apps.Entry e = ordered.get(i);
                      Tile t = Tile.forApp(this, e, radius, ring, px(w * 0.032f));
                      t.setOnClickListener(v -> { if (!moveMode) Apps.launch(this, e); });
                      t.setLongClickable(true);
                      t.setOnLongClickListener(v -> { showAppMenu(e); return true; });
                      t.setFocusable(true);
                      t.setContentDescription(e.label);
                      if (moveMode && e.pkg.equals(movingPackage)) {
                          t.setTranslationY(-px(h * 0.018f));
                          t.setScaleX(1.06f); t.setScaleY(1.06f);
                      }
                      dock.addView(t, tileLp(appW, tileH, gap));
                      t.setOnFocusChangeListener((v, hasFocus) -> {
                          if (hasFocus) {
                              int current = dock.indexOfChild(v);
                              if (current >= 0) lastIndex = current;
                          }
                      });
                  }
                  if (!ordered.isEmpty()) dock.getChildAt(Math.max(0, Math.min(lastIndex, ordered.size()-1))).requestFocus();
              }


              private void brightnessRow() {
                  LinearLayout item = new LinearLayout(this);
                  item.setOrientation(LinearLayout.VERTICAL);
                  item.setGravity(Gravity.CENTER);
                  item.setPadding(dp(4), dp(5), dp(4), dp(5));

                  FrameLayout bubble = new FrameLayout(this);
                  GradientDrawable bubbleBg = new GradientDrawable();
                  bubbleBg.setShape(GradientDrawable.OVAL);
                  bubbleBg.setColor(0x222B3444);
                  bubbleBg.setStroke(dp(1), 0x333D7BFF);
                  bubble.setBackground(bubbleBg);
                  bubble.addView(new IconView(this, IconView.SUN),
                          new FrameLayout.LayoutParams(dp(28), dp(28), Gravity.CENTER));
                  item.addView(bubble, new LinearLayout.LayoutParams(dp(54), dp(54)));

                  levelText = label("Brilho " + level + "%");
                  levelText.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  levelText.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams captionLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  captionLp.topMargin = dp(4);
                  item.addView(levelText, captionLp);
                  item.setFocusable(true);
                  item.setOnClickListener(v -> showBrightnessOnly());
                  item.setOnKeyListener((v, keyCode, event) -> {
                      if (event.getAction() != KeyEvent.ACTION_DOWN) return false;
                      if (keyCode == KeyEvent.KEYCODE_DPAD_CENTER || keyCode == KeyEvent.KEYCODE_ENTER) {
                          showBrightnessOnly(); return true;
                      }
                      return false;
                  });
                  focusStyle(item);
                  addToPanel(item);
              }

              private void showBrightnessOnly() {
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(0x00000000);
                  LinearLayout control = new LinearLayout(this);
                  control.setOrientation(LinearLayout.VERTICAL);
                  control.setGravity(Gravity.CENTER);
                  control.setPadding(dp(28), dp(18), dp(28), dp(18));
                  control.setBackgroundColor(0x00000000);
                  LinearLayout top = new LinearLayout(this);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.addView(new IconView(this, IconView.SUN), new LinearLayout.LayoutParams(dp(36), dp(36)));
                  TextView title = label("Brilho"); title.setTextSize(TypedValue.COMPLEX_UNIT_SP, 22);
                  LinearLayout.LayoutParams titleLp = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  titleLp.leftMargin = dp(14); top.addView(title, titleLp);
                  TextView percent = label(level + "%"); percent.setTextSize(TypedValue.COMPLEX_UNIT_SP, 20); top.addView(percent);
                  control.addView(top);
                  BarView brightnessBar = new BarView(this);
                  LinearLayout.LayoutParams barLp = new LinearLayout.LayoutParams(dp(420), dp(10)); barLp.topMargin = dp(18);
                  control.addView(brightnessBar, barLp);
                  brightnessBar.setFraction((level - Prefs.MIN_BRIGHTNESS) / (float)(100 - Prefs.MIN_BRIGHTNESS));
                  FrameLayout.LayoutParams cp = new FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL);
                  cp.bottomMargin = dp(42); root.addView(control, cp);
                  setContentView(root);
                  control.setFocusable(true); control.requestFocus();
                  control.setOnKeyListener((v, key, ev) -> {
                      if (ev.getAction() != KeyEvent.ACTION_DOWN) return false;
                      if (key == KeyEvent.KEYCODE_DPAD_LEFT || key == KeyEvent.KEYCODE_DPAD_RIGHT) {
                          setLevel(level + (key == KeyEvent.KEYCODE_DPAD_RIGHT ? STEP : -STEP));
                          percent.setText(level + "%");
                          brightnessBar.setFraction((level - Prefs.MIN_BRIGHTNESS) / (float)(100 - Prefs.MIN_BRIGHTNESS));
                          return true;
                      }
                      if (key == KeyEvent.KEYCODE_BACK || key == KeyEvent.KEYCODE_DPAD_CENTER || key == KeyEvent.KEYCODE_ENTER) { finish(); return true; }
                      return false;
                  });
              }

              private void setLevel(int value) {
                  int v = Math.max(Prefs.MIN_BRIGHTNESS, Math.min(100, value));
                  if (v == level) return;
                  PanelService s = PanelService.instance;
                  if (s == null) {
                      Toasts.show(this, "Serviço não está ativo", Toast.LENGTH_SHORT);
                      return;
                  }
                  level = v;
                  Prefs.saveBrightness(this, level);
                  s.applyBrightness(level);
                  updateLevel();
              }

              private void updateLevel() {
                  levelText.setText("Brilho " + level + "%");
                  if (bar != null) bar.setFraction((level - Prefs.MIN_BRIGHTNESS) / (float) (100 - Prefs.MIN_BRIGHTNESS));
              }

              // ---------------- Volume (igual ao brilho) ----------------

              private int volPercent() {
                  return Math.round(vol * 100f / volMax);
              }

              private int volStep() {
                  return Math.max(1, Math.round(volMax * STEP / 100f));
              }

              private void volumeRow() {
                  LinearLayout item = new LinearLayout(this);
                  item.setOrientation(LinearLayout.VERTICAL);
                  item.setGravity(Gravity.CENTER);
                  item.setPadding(dp(4), dp(5), dp(4), dp(5));

                  FrameLayout bubble = new FrameLayout(this);
                  GradientDrawable bubbleBg = new GradientDrawable();
                  bubbleBg.setShape(GradientDrawable.OVAL);
                  bubbleBg.setColor(0x222B3444);
                  bubbleBg.setStroke(dp(1), 0x333D7BFF);
                  bubble.setBackground(bubbleBg);
                  bubble.addView(new IconView(this, IconView.VOLUME),
                          new FrameLayout.LayoutParams(dp(28), dp(28), Gravity.CENTER));
                  item.addView(bubble, new LinearLayout.LayoutParams(dp(54), dp(54)));

                  volText = label("Volume " + volPercent() + "%");
                  volText.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  volText.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams captionLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  captionLp.topMargin = dp(4);
                  item.addView(volText, captionLp);
                  item.setFocusable(true);
                  item.setOnClickListener(v -> showVolumeOnly());
                  item.setOnKeyListener((v, keyCode, event) -> {
                      if (event.getAction() != KeyEvent.ACTION_DOWN) return false;
                      if (keyCode == KeyEvent.KEYCODE_DPAD_CENTER || keyCode == KeyEvent.KEYCODE_ENTER) {
                          showVolumeOnly(); return true;
                      }
                      return false;
                  });
                  focusStyle(item);
                  addToPanel(item);
              }

              private void showVolumeOnly() {
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(0x00000000);
                  LinearLayout control = new LinearLayout(this);
                  control.setOrientation(LinearLayout.VERTICAL);
                  control.setGravity(Gravity.CENTER);
                  control.setPadding(dp(28), dp(18), dp(28), dp(18));
                  control.setBackgroundColor(0x00000000);
                  LinearLayout top = new LinearLayout(this);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.addView(new IconView(this, IconView.VOLUME), new LinearLayout.LayoutParams(dp(36), dp(36)));
                  TextView title = label("Volume"); title.setTextSize(TypedValue.COMPLEX_UNIT_SP, 22);
                  LinearLayout.LayoutParams titleLp = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  titleLp.leftMargin = dp(14); top.addView(title, titleLp);
                  TextView percent = label(volPercent() + "%"); percent.setTextSize(TypedValue.COMPLEX_UNIT_SP, 20); top.addView(percent);
                  control.addView(top);
                  BarView volumeBar = new BarView(this);
                  LinearLayout.LayoutParams barLp = new LinearLayout.LayoutParams(dp(420), dp(10)); barLp.topMargin = dp(18);
                  control.addView(volumeBar, barLp);
                  volumeBar.setFraction(vol / (float) volMax);
                  FrameLayout.LayoutParams cp = new FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL);
                  cp.bottomMargin = dp(42); root.addView(control, cp);
                  setContentView(root);
                  control.setFocusable(true); control.requestFocus();
                  control.setOnKeyListener((v, key, ev) -> {
                      if (ev.getAction() != KeyEvent.ACTION_DOWN) return false;
                      if (key == KeyEvent.KEYCODE_DPAD_LEFT || key == KeyEvent.KEYCODE_DPAD_RIGHT) {
                          setVolume(vol + (key == KeyEvent.KEYCODE_DPAD_RIGHT ? volStep() : -volStep()));
                          percent.setText(volPercent() + "%");
                          volumeBar.setFraction(vol / (float) volMax);
                          return true;
                      }
                      if (key == KeyEvent.KEYCODE_BACK || key == KeyEvent.KEYCODE_DPAD_CENTER || key == KeyEvent.KEYCODE_ENTER) { finish(); return true; }
                      return false;
                  });
              }

              private void setVolume(int value) {
                  int v = Math.max(0, Math.min(volMax, value));
                  if (v == vol) return;
                  if (audio.isVolumeFixed()) {
                      Toasts.show(this, "Esta TV usa volume fixo", Toast.LENGTH_SHORT);
                      return;
                  }
                  try {
                      audio.setStreamVolume(AudioManager.STREAM_MUSIC, v, 0);
                      vol = audio.getStreamVolume(AudioManager.STREAM_MUSIC);
                  } catch (Exception e) {
                      Toasts.show(this, "Não foi possível mudar o volume", Toast.LENGTH_SHORT);
                      return;
                  }
                  if (volText != null) volText.setText("Volume " + volPercent() + "%");
              }

              // ---------------- Aplicativos ----------------

              private void showAppsBar() {
                  final List<Apps.Entry> list = Apps.ordered(this);
                  if (list.isEmpty()) {
                      Toasts.show(this, "Nenhum aplicativo encontrado", Toast.LENGTH_SHORT);
                      return;
                  }
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(0x00000000);
                  root.setClipChildren(false);
                  root.setOnClickListener(v -> finish());

                  // Mesmo tema da tela inicial: blocos neon com reflexo, 6 por tela, sem fundo.
                  float sw = getResources().getDisplayMetrics().widthPixels;
                  int gap = (int) (sw * 0.006f);
                  int tileW = (int) ((sw - sw * 0.024f - gap * 5) / 6f);
                  int tileH = (int) (sw * 0.075f);
                  float radius = sw * 0.0095f;
                  int ring = (int) (sw * 0.0018f) + 2;
                  int reflectPx = (int) (tileH * 0.38f);
                  int padH = (int) (sw * 0.012f);
                  int padV = (int) (sw * 0.012f);

                  ReflectRow strip = new ReflectRow(this, reflectPx, (int) (tileH * 0.05f));
                  strip.setGravity(Gravity.CENTER);
                  strip.setPadding(padH, padV, padH, reflectPx);
                  View firstItem = null;
                  for (Apps.Entry e : list) {
                      Tile t = Tile.forApp(this, e, radius, ring, (int) (sw * 0.032f));
                      t.setOnClickListener(v -> v.animate().scaleX(0.92f).scaleY(0.92f).setDuration(90)
                              .withEndAction(() -> {
                                  Apps.launch(this, e);
                                  finish();
                              }).start());
                      LinearLayout.LayoutParams ip = new LinearLayout.LayoutParams(tileW, tileH);
                      ip.leftMargin = gap / 2; ip.rightMargin = gap / 2;
                      strip.addView(t, ip);
                      if (firstItem == null) firstItem = t;
                  }

                  HorizontalScrollView scroll = new HorizontalScrollView(this);
                  scroll.setHorizontalScrollBarEnabled(false);
                  scroll.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  scroll.setFillViewport(true);
                  scroll.setClipChildren(false);
                  scroll.setClipToPadding(false);
                  scroll.addView(strip, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  FrameLayout.LayoutParams sp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM);
                  sp.bottomMargin = dp(10);
                  root.addView(scroll, sp);
                  setContentView(root);
                  firstItem.requestFocus();
              }

              // No Android 14 o atalho antigo do sistema virou um "stub" que nao faz nada.
              // O caminho que funciona e a acao SLEEP das Configuracoes da TV.
              private void startScreensaver() {
                  Intent i = new Intent("com.google.android.pano.action.SLEEP");
                  i.setClassName("com.android.tv.settings",
                          "com.android.tv.settings.device.display.daydream.DaydreamVoiceAction");
                  if (tryStart(i)) return;
                  if (tryStart(new Intent("com.google.android.pano.action.SLEEP"))) return;
                  Toasts.show(this, "Não disponível nesta TV", Toast.LENGTH_SHORT);
              }

              private boolean tryStart(Intent i) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      startActivity(i);
                      finish();
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private void open(Intent i) {
                  if (!tryStart(i)) {
                      Toasts.show(this, "Não disponível nesta TV", Toast.LENGTH_SHORT);
                  }
              }
          }

              private void addMenuButton(LinearLayout box, String label, Runnable action) {
                  TextView b = new TextView(this);
                  b.setText(label); b.setTextColor(0xFFFFFFFF); b.setTextSize(TypedValue.COMPLEX_UNIT_SP, 18);
                  b.setGravity(Gravity.CENTER_VERTICAL); b.setFocusable(true); b.setPadding(px(w*0.012f), px(h*0.012f), px(w*0.012f), px(h*0.012f));
                  GradientDrawable bg = new GradientDrawable(); bg.setColor(0xFF202B3B); bg.setCornerRadius(px(w*0.006f)); bg.setStroke(px(1), ACCENT_BLUE); b.setBackground(bg);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT); lp.bottomMargin = px(h*0.006f); box.addView(b, lp);
                  b.setOnFocusChangeListener((v, f) -> { GradientDrawable g = new GradientDrawable(); g.setColor(f ? 0xFF1769AA : 0xFF202B3B); g.setCornerRadius(px(w*0.006f)); g.setStroke(px(f?2:1), ACCENT_BLUE); b.setBackground(g); });

          cat > painel/app/src/main/java/com/painel/lateral/Prefs.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.content.Context;

          import java.util.LinkedHashSet;
          import java.util.Set;

          final class Prefs {
              static final int DEFAULT_KEY = 176;

              private Prefs() { }

              static Set<Integer> keys(Context c) {
                  String s = c.getSharedPreferences("painel", Context.MODE_PRIVATE)
                          .getString("keys", String.valueOf(DEFAULT_KEY));
                  Set<Integer> r = new LinkedHashSet<>();
                  for (String p : s.split(",")) {
                      try {
                          r.add(Integer.parseInt(p.trim()));
                      } catch (NumberFormatException e) {
                          // ignora valor invalido
                      }
                  }
                  return r;
              }

              static void save(Context c, Set<Integer> keys) {
                  StringBuilder sb = new StringBuilder();
                  for (int k : keys) {
                      if (sb.length() > 0) sb.append(',');
                      sb.append(k);
                  }
                  c.getSharedPreferences("painel", Context.MODE_PRIVATE)
                          .edit().putString("keys", sb.toString()).apply();
              }

              static final int MIN_BRIGHTNESS = 20;

              static int brightness(Context c) {
                  int v = c.getSharedPreferences("painel", Context.MODE_PRIVATE).getInt("brightness", 100);
                  return Math.max(MIN_BRIGHTNESS, Math.min(100, v));
              }

              static void saveBrightness(Context c, int level) {
                  c.getSharedPreferences("painel", Context.MODE_PRIVATE)
                          .edit().putInt("brightness", level).apply();
              }

              // Botoes que nunca podem ser capturados: navegacao, voltar, home, volume, power.
              static boolean allowed(int code) {
                  switch (code) {
                      case 3:
                      case 4:
                      case 19:
                      case 20:
                      case 21:
                      case 22:
                      case 23:
                      case 24:
                      case 25:
                      case 26:
                      case 66:
                      case 164:
                          return false;
                      default:
                          return code > 0;
                  }
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/IconView.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.view.View;

          final class IconView extends View {
              static final int WIFI = 0;
              static final int SCREEN = 1;
              static final int CLOCK = 2;
              static final int GEAR = 3;
              static final int SUN = 4;
              static final int APPS = 5;

              private final int type;
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF r = new RectF();

              IconView(Context c, int type) {
                  super(c);
                  this.type = type;
                  p.setStrokeCap(Paint.Cap.ROUND);
                  p.setColor(0xFFFFFFFF);
              }

              @Override
              protected void onDraw(Canvas c) {
                  float w = getWidth();
                  float h = getHeight();
                  float u = Math.min(w, h) / 24f;
                  float cx = w / 2f;
                  float cy = h / 2f;
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(2f * u);

                  switch (type) {
                      case WIFI: {
                          float by = cy + 7f * u;
                          for (int i = 1; i <= 3; i++) {
                              float rad = i * 5.2f * u;
                              r.set(cx - rad, by - rad, cx + rad, by + rad);
                              c.drawArc(r, -135f, 90f, false, p);
                          }
                          p.setStyle(Paint.Style.FILL);
                          c.drawCircle(cx, by, 1.7f * u, p);
                          break;
                      }
                      case SCREEN: {
                          r.set(cx - 10f * u, cy - 8f * u, cx + 10f * u, cy + 4f * u);
                          c.drawRoundRect(r, 2.5f * u, 2.5f * u, p);
                          c.drawLine(cx, cy + 4f * u, cx, cy + 8f * u, p);
                          c.drawLine(cx - 4.5f * u, cy + 8f * u, cx + 4.5f * u, cy + 8f * u, p);
                          break;
                      }
                      case CLOCK: {
                          c.drawCircle(cx, cy, 9f * u, p);
                          c.drawLine(cx, cy, cx, cy - 5.5f * u, p);
                          c.drawLine(cx, cy, cx + 4f * u, cy + 2.5f * u, p);
                          break;
                      }
                      case SUN: {
                          c.drawCircle(cx, cy, 4.2f * u, p);
                          for (int i = 0; i < 8; i++) {
                              double a = Math.toRadians(i * 45.0);
                              float dx = (float) Math.cos(a);
                              float dy = (float) Math.sin(a);
                              c.drawLine(cx + dx * 7.5f * u, cy + dy * 7.5f * u,
                                      cx + dx * 10.5f * u, cy + dy * 10.5f * u, p);
                          }
                          break;
                      }
                      case APPS: {
                          for (int gx = 0; gx < 2; gx++) {
                              for (int gy = 0; gy < 2; gy++) {
                                  float x0 = cx + (gx == 0 ? -8.8f : 1.2f) * u;
                                  float y0 = cy + (gy == 0 ? -8.8f : 1.2f) * u;
                                  r.set(x0, y0, x0 + 7.6f * u, y0 + 7.6f * u);
                                  c.drawRoundRect(r, 2f * u, 2f * u, p);
                              }
                          }
                          break;
                      }
                      default: {
                          c.drawCircle(cx, cy, 6f * u, p);
                          p.setStrokeWidth(2.6f * u);
                          for (int i = 0; i < 8; i++) {
                              double a = Math.toRadians(i * 45.0);
                              float dx = (float) Math.cos(a);
                              float dy = (float) Math.sin(a);
                              c.drawLine(cx + dx * 8f * u, cy + dy * 8f * u,
                                      cx + dx * 10.5f * u, cy + dy * 10.5f * u, p);
                          }
                          p.setStrokeWidth(2f * u);
                          c.drawCircle(cx, cy, 2.2f * u, p);
                          break;
                      }
                  }
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/BarView.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.view.View;

          final class BarView extends View {
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF r = new RectF();
              private float frac = 1f;

              BarView(Context c) {
                  super(c);
              }

              void setFraction(float f) {
                  frac = Math.max(0f, Math.min(1f, f));
                  invalidate();
              }

              @Override
              protected void onDraw(Canvas c) {
                  float w = getWidth();
                  float h = getHeight();
                  float rad = h / 2f;
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(0x302D3748);
                  r.set(0f, 0f, w, h);
                  c.drawRoundRect(r, rad, rad, p);
                  p.setColor(0xFF168BFF);
                  r.set(0f, 0f, Math.max(0f, w * frac), h);
                  c.drawRoundRect(r, rad, rad, p);
                  p.setColor(0xFFEAF5FF);
                  c.drawCircle(Math.max(rad, Math.min(w - rad, w * frac)), h / 2f, Math.max(2f, h * 0.72f), p);
                  p.setColor(0xFF168BFF);
                  c.drawCircle(Math.max(rad, Math.min(w - rad, w * frac)), h / 2f, Math.max(1f, h * 0.38f), p);
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/ClockDream.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.service.dreams.DreamService;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.TextClock;

          public class ClockDream extends DreamService {
              @Override
              public void onAttachedToWindow() {
                  super.onAttachedToWindow();
                  setInteractive(false);
                  setFullscreen(true);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);

                  TextClock clock = new TextClock(this);
                  clock.setFormat24Hour("HH:mm");
                  clock.setFormat12Hour("HH:mm");
                  clock.setTextColor(Color.WHITE);
                  clock.setTextSize(TypedValue.COMPLEX_UNIT_SP, 22);
                  clock.setTypeface(Typeface.create("sans-serif-light", Typeface.NORMAL));

                  float d = getResources().getDisplayMetrics().density;
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP | Gravity.END);
                  lp.topMargin = (int) (28 * d);
                  lp.rightMargin = (int) (36 * d);
                  root.addView(clock, lp);

                  setContentView(root);
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/PanelService.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.PixelFormat;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;

          public class PanelService extends AccessibilityService {
              static PanelService instance;

              private View dimView;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  applyBrightness(Prefs.brightness(this));
              }

              @Override
              public boolean onUnbind(Intent intent) {
                  instance = null;
                  removeDim();
                  return super.onUnbind(intent);
              }

              @Override
              public void onDestroy() {
                  removeDim();
                  super.onDestroy();
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) { }

              @Override
              public void onInterrupt() { }

              // "Brilho" por software: uma camada preta transparente sobre toda a tela.
              // Nao mexe na luz de fundo real da TV (o Android nao permite isso a apps).
              void applyBrightness(int level) {
                  if (level >= 100) {
                      removeDim();
                      return;
                  }
                  float alpha = (100 - level) / 100f;
                  try {
                      if (dimView == null) {
                          WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                          View v = new View(this);
                          v.setBackgroundColor(0xFF000000);
                          WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                          | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                          | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                          | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                                  PixelFormat.TRANSLUCENT);
                          wm.addView(v, lp);
                          dimView = v;
                      }
                      dimView.setAlpha(alpha);
                  } catch (Exception e) {
                      dimView = null;
                  }
              }

              private void removeDim() {
                  if (dimView == null) return;
                  try {
                      WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                      wm.removeView(dimView);
                  } catch (Exception e) {
                      // ja removida
                  }
                  dimView = null;
              }

              @Override
              protected boolean onKeyEvent(KeyEvent event) {
                  // Nunca consumir volume: a TV/sistema precisa receber todos os eventos
                  // repetidos durante o pressionamento longo do controle remoto.
                  int code = event.getKeyCode();
                  if (code == KeyEvent.KEYCODE_VOLUME_UP
                          || code == KeyEvent.KEYCODE_VOLUME_DOWN
                          || code == KeyEvent.KEYCODE_VOLUME_MUTE) return false;

                  // Os demais botoes seguem normalmente para o sistema.
                  if (MainActivity.visible) return false;
                  if (!Prefs.keys(this).contains(code)) return false;

                  if (event.getAction() == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0) {
                      PanelActivity open = PanelActivity.current;
                      if (open != null) {
                          open.finish();
                      } else {
                          Intent i = new Intent(this, PanelActivity.class);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_NO_ANIMATION);
                          startActivity(i);
                      }
                  }
                  return true;
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/AppsBar.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.graphics.Outline;
          import android.graphics.Typeface;
          import android.graphics.drawable.AdaptiveIconDrawable;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.text.TextUtils;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.ViewOutlineProvider;
          import android.view.animation.DecelerateInterpolator;
          import android.view.animation.OvershootInterpolator;
          import android.widget.FrameLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;

          final class AppsBar extends FrameLayout {
              private static final String PREFS = "apps_bar", ORDER = "order", HIDDEN = "hidden";
              private static final int BLUE = 0xFF4DA3FF;
              private final HorizontalScrollView scroll;
              private final LinearLayout row;
              private final float d;
              private List<Entry> entries;
              private boolean loading, open, movingMode, longPressHandled;
              private Entry movingEntry;
              private int targetIndex = -1, upId = View.NO_ID;
              private Runnable onLaunched, onOpenChanged;

              private static final class Entry {
                  String label, category, pkg;
                  ComponentName name;
                  Drawable icon;
              }

              AppsBar(Context c) {
                  super(c);
                  d = c.getResources().getDisplayMetrics().density;
                  setVisibility(GONE);
                  setClipChildren(false); setClipToPadding(false);
                  scroll = new HorizontalScrollView(c);
                  scroll.setHorizontalScrollBarEnabled(false); scroll.setOverScrollMode(OVER_SCROLL_NEVER);
                  scroll.setFocusable(false); scroll.setFillViewport(true);
                  scroll.setClipChildren(false); scroll.setClipToPadding(false);
                  scroll.setPadding(dp(36), dp(22), dp(36), dp(12));
                  row = new LinearLayout(c); row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER); row.setClipChildren(false);
                  scroll.addView(row, new FrameLayout.LayoutParams(-2, -2));
                  addView(scroll, new FrameLayout.LayoutParams(-1, -2));
              }
              private int dp(int v) { return (int)(v*d); }
              boolean isOpen() { return open; }
              boolean isMovingMode() { return movingMode; }
              void setUpTarget(int id) { upId = id; }
              void setOnOpenChanged(Runnable callback) { onOpenChanged = callback; }
              private android.content.SharedPreferences prefs() { return getContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE); }
              private Set<String> hiddenSet() { return new HashSet<>(prefs().getStringSet(HIDDEN, new HashSet<>())); }

              void open(Runnable launched, Runnable onEmpty) {
                  onLaunched = launched;
                  if (entries != null) { show(onEmpty); return; }
                  if (loading) return;
                  loading = true;
                  Context c = getContext();
                  new Thread(() -> { List<Entry> found = query(c); post(() -> {
                      loading = false; entries = found; build(); show(onEmpty);
                  }); }).start();
              }
              void close() {
                  if (!open) return;
                  open = false; movingMode = false; movingEntry = null; targetIndex = -1;
                  if (onOpenChanged != null) onOpenChanged.run();
                  animate().alpha(0f).translationY(dp(24)).setDuration(140)
                      .withEndAction(() -> { if (!open) setVisibility(GONE); }).start();
              }
              void finishEditing() { movingMode = false; movingEntry = null; targetIndex = -1; saveOrder(); }
              private void show(Runnable onEmpty) {
                  if (entries.isEmpty()) { if (onEmpty != null) onEmpty.run(); return; }
                  open = true; if (onOpenChanged != null) onOpenChanged.run();
                  setVisibility(VISIBLE); setAlpha(0f); setTranslationY(dp(24));
                  animate().alpha(1f).translationY(0f).setDuration(190).setInterpolator(new DecelerateInterpolator()).start();
                  for (int i=0;i<row.getChildCount();i++) row.getChildAt(i).animate().alpha(1f).translationY(0f).setStartDelay(Math.min(i,10)*20L).setDuration(180).start();
                  scroll.scrollTo(0,0); if (row.getChildCount()>0) row.getChildAt(0).requestFocus();
              }
              private static List<Entry> query(Context c) {
                  PackageManager pm=c.getPackageManager(); Map<String,Entry> map=new LinkedHashMap<>();
                  for (String cat : new String[]{Intent.CATEGORY_LEANBACK_LAUNCHER,Intent.CATEGORY_LAUNCHER}) {
                      Intent i=new Intent(Intent.ACTION_MAIN); i.addCategory(cat);
                      for (ResolveInfo ri:pm.queryIntentActivities(i,0)) {
                          String pkg=ri.activityInfo.packageName; if (pkg.equals(c.getPackageName())||map.containsKey(pkg)) continue;
                          Entry e=new Entry(); e.label=String.valueOf(ri.loadLabel(pm)); e.category=cat; e.pkg=pkg;
                          e.name=new ComponentName(pkg,ri.activityInfo.name); e.icon=ri.loadIcon(pm); map.put(pkg,e);
                      }
                  }
                  List<Entry> list=new ArrayList<>(map.values());
                  list.removeIf(e->new HashSet<>(c.getSharedPreferences(PREFS,Context.MODE_PRIVATE).getStringSet(HIDDEN,new HashSet<>())).contains(e.pkg));
                  Collections.sort(list,(a,b)->a.label.compareToIgnoreCase(b.label));
                  String order=c.getSharedPreferences(PREFS,Context.MODE_PRIVATE).getString(ORDER,"");
                  if(!order.isEmpty()) { Map<String,Integer> ranks=new LinkedHashMap<>(); String[] parts=order.split("\\|");
                      for(int j=0;j<parts.length;j++) ranks.put(parts[j],j);
                      Collections.sort(list,(a,b)->{int x=ranks.getOrDefault(a.pkg,Integer.MAX_VALUE),y=ranks.getOrDefault(b.pkg,Integer.MAX_VALUE); return x==y?a.label.compareToIgnoreCase(b.label):Integer.compare(x,y);}); }
                  return list;
              }
              private void build() {
                  row.removeAllViews();
                  for (Entry e:entries) row.addView(bubble(e));
              }
              private View bubble(final Entry e) {
                  Context c=getContext(); LinearLayout b=new LinearLayout(c); b.setOrientation(LinearLayout.VERTICAL); b.setGravity(Gravity.CENTER_HORIZONTAL);
                  b.setFocusable(true); b.setClickable(true); b.setClipChildren(false); b.setNextFocusUpId(upId);
                  ImageView icon=new ImageView(c); GradientDrawable bg=new GradientDrawable(); bg.setShape(GradientDrawable.OVAL); bg.setColor(0xFF151B2A); icon.setBackground(bg);

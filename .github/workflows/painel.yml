                      dialog.getWindow().setBackgroundDrawableResource(android.R.color.transparent);
                      dialog.getWindow().setLayout((int)(w*0.42f), ViewGroup.LayoutParams.WRAP_CONTENT);
                  }
              }

              private LinearLayout.LayoutParams tileLp(float tw, float th, int gap) {
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(px(tw), px(th));
                  lp.rightMargin = gap;
                  return lp;
              }


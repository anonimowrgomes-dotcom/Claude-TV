              private void row(int icon, String text, Runnable action) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.VERTICAL);
                  row.setGravity(Gravity.CENTER);
                  row.setPadding(dp(4), dp(5), dp(4), dp(5));

                  FrameLayout bubble = new FrameLayout(this);
                  GradientDrawable bubbleBg = new GradientDrawable();
                  bubbleBg.setShape(GradientDrawable.OVAL); bubbleBg.setColor(0x222B3444);
                  bubbleBg.setStroke(dp(1), 0x333D7BFF); bubble.setBackground(bubbleBg);

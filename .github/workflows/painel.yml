name: Build Painel Lateral
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Criar projeto
        run: |
          mkdir -p painel/app/src/main/java/com/painel/lateral painel/app/src/main/res/xml painel/app/src/main/res/values
          cat > painel/settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'painel'
          include ':app'
          EOF_FILE
          cat > painel/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_FILE
          cat > painel/gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF_FILE
          cat > painel/app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.painel.lateral'
              compileSdk 34

              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }

              defaultConfig {
                  applicationId 'com.painel.lateral'
                  minSdk 26
                  targetSdk 29
                  versionCode 3
                  versionName '1.3'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_FILE
          cat > painel/app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />

              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".PanelActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:launchMode="singleTask"
                      android:taskAffinity=""
                      android:theme="@android:style/Theme.Translucent.NoTitleBar" />

                  <service
                      android:name=".ClockDream"
                      android:exported="true"
                      android:label="Relógio preto"
                      android:permission="android.permission.BIND_DREAM_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.dreams.DreamService" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </service>

                  <service
                      android:name=".PanelService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF_FILE
          cat > painel/app/src/main/res/xml/accessibility_config.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canRequestFilterKeyEvents="true"
              android:notificationTimeout="100"
              android:description="@string/service_description" />
          EOF_FILE
          cat > painel/app/src/main/res/values/strings.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Painel Lateral</string>
              <string name="service_description">Abre o painel lateral quando o botão escolhido do controle é apertado.</string>
          </resources>
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/Prefs.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.content.Context;

          import java.util.LinkedHashSet;
          import java.util.Set;

          final class Prefs {
              static final int DEFAULT_KEY = 176;

              private Prefs() { }

              static Set<Integer> keys(Context c) {
                  String s = c.getSharedPreferences("painel", Context.MODE_PRIVATE)
                          .getString("keys", String.valueOf(DEFAULT_KEY));
                  Set<Integer> r = new LinkedHashSet<>();
                  for (String p : s.split(",")) {
                      try {
                          r.add(Integer.parseInt(p.trim()));
                      } catch (NumberFormatException e) {
                          // ignora valor invalido
                      }
                  }
                  return r;
              }

              static void save(Context c, Set<Integer> keys) {
                  StringBuilder sb = new StringBuilder();
                  for (int k : keys) {
                      if (sb.length() > 0) sb.append(',');
                      sb.append(k);
                  }
                  c.getSharedPreferences("painel", Context.MODE_PRIVATE)
                          .edit().putString("keys", sb.toString()).apply();
              }

              static final int MIN_BRIGHTNESS = 20;

              static int brightness(Context c) {
                  int v = c.getSharedPreferences("painel", Context.MODE_PRIVATE).getInt("brightness", 100);
                  return Math.max(MIN_BRIGHTNESS, Math.min(100, v));
              }

              static void saveBrightness(Context c, int level) {
                  c.getSharedPreferences("painel", Context.MODE_PRIVATE)
                          .edit().putInt("brightness", level).apply();
              }

              // Botoes que nunca podem ser capturados: navegacao, voltar, home, volume, power.
              static boolean allowed(int code) {
                  switch (code) {
                      case 3:
                      case 4:
                      case 19:
                      case 20:
                      case 21:
                      case 22:
                      case 23:
                      case 24:
                      case 25:
                      case 26:
                      case 66:
                      case 164:
                          return false;
                      default:
                          return code > 0;
                  }
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/IconView.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.view.View;

          final class IconView extends View {
              static final int WIFI = 0;
              static final int SCREEN = 1;
              static final int CLOCK = 2;
              static final int GEAR = 3;
              static final int SUN = 4;

              private final int type;
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF r = new RectF();

              IconView(Context c, int type) {
                  super(c);
                  this.type = type;
                  p.setStrokeCap(Paint.Cap.ROUND);
                  p.setColor(0xFFFFFFFF);
              }

              @Override
              protected void onDraw(Canvas c) {
                  float w = getWidth();
                  float h = getHeight();
                  float u = Math.min(w, h) / 24f;
                  float cx = w / 2f;
                  float cy = h / 2f;
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(2f * u);

                  switch (type) {
                      case WIFI: {
                          float by = cy + 7f * u;
                          for (int i = 1; i <= 3; i++) {
                              float rad = i * 5.2f * u;
                              r.set(cx - rad, by - rad, cx + rad, by + rad);
                              c.drawArc(r, -135f, 90f, false, p);
                          }
                          p.setStyle(Paint.Style.FILL);
                          c.drawCircle(cx, by, 1.7f * u, p);
                          break;
                      }
                      case SCREEN: {
                          r.set(cx - 10f * u, cy - 8f * u, cx + 10f * u, cy + 4f * u);
                          c.drawRoundRect(r, 2.5f * u, 2.5f * u, p);
                          c.drawLine(cx, cy + 4f * u, cx, cy + 8f * u, p);
                          c.drawLine(cx - 4.5f * u, cy + 8f * u, cx + 4.5f * u, cy + 8f * u, p);
                          break;
                      }
                      case CLOCK: {
                          c.drawCircle(cx, cy, 9f * u, p);
                          c.drawLine(cx, cy, cx, cy - 5.5f * u, p);
                          c.drawLine(cx, cy, cx + 4f * u, cy + 2.5f * u, p);
                          break;
                      }
                      case SUN: {
                          c.drawCircle(cx, cy, 4.2f * u, p);
                          for (int i = 0; i < 8; i++) {
                              double a = Math.toRadians(i * 45.0);
                              float dx = (float) Math.cos(a);
                              float dy = (float) Math.sin(a);
                              c.drawLine(cx + dx * 7.5f * u, cy + dy * 7.5f * u,
                                      cx + dx * 10.5f * u, cy + dy * 10.5f * u, p);
                          }
                          break;
                      }
                      default: {
                          c.drawCircle(cx, cy, 6f * u, p);
                          p.setStrokeWidth(2.6f * u);
                          for (int i = 0; i < 8; i++) {
                              double a = Math.toRadians(i * 45.0);
                              float dx = (float) Math.cos(a);
                              float dy = (float) Math.sin(a);
                              c.drawLine(cx + dx * 8f * u, cy + dy * 8f * u,
                                      cx + dx * 10.5f * u, cy + dy * 10.5f * u, p);
                          }
                          p.setStrokeWidth(2f * u);
                          c.drawCircle(cx, cy, 2.2f * u, p);
                          break;
                      }
                  }
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/BarView.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.view.View;

          final class BarView extends View {
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF r = new RectF();
              private float frac = 1f;

              BarView(Context c) {
                  super(c);
              }

              void setFraction(float f) {
                  frac = Math.max(0f, Math.min(1f, f));
                  invalidate();
              }

              @Override
              protected void onDraw(Canvas c) {
                  float w = getWidth();
                  float h = getHeight();
                  float rad = h / 2f;
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(0x302D3748);
                  r.set(0f, 0f, w, h);
                  c.drawRoundRect(r, rad, rad, p);
                  p.setColor(0xFF168BFF);
                  r.set(0f, 0f, Math.max(0f, w * frac), h);
                  c.drawRoundRect(r, rad, rad, p);
                  p.setColor(0xFFEAF5FF);
                  c.drawCircle(Math.max(rad, Math.min(w - rad, w * frac)), h / 2f, Math.max(2f, h * 0.72f), p);
                  p.setColor(0xFF168BFF);
                  c.drawCircle(Math.max(rad, Math.min(w - rad, w * frac)), h / 2f, Math.max(1f, h * 0.38f), p);
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/ClockDream.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.service.dreams.DreamService;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.TextClock;

          public class ClockDream extends DreamService {
              @Override
              public void onAttachedToWindow() {
                  super.onAttachedToWindow();
                  setInteractive(false);
                  setFullscreen(true);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);

                  TextClock clock = new TextClock(this);
                  clock.setFormat24Hour("HH:mm");
                  clock.setFormat12Hour("HH:mm");
                  clock.setTextColor(Color.WHITE);
                  clock.setTextSize(TypedValue.COMPLEX_UNIT_SP, 22);
                  clock.setTypeface(Typeface.create("sans-serif-light", Typeface.NORMAL));

                  float d = getResources().getDisplayMetrics().density;
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP | Gravity.END);
                  lp.topMargin = (int) (28 * d);
                  lp.rightMargin = (int) (36 * d);
                  root.addView(clock, lp);

                  setContentView(root);
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/PanelService.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.PixelFormat;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;

          public class PanelService extends AccessibilityService {
              static PanelService instance;

              private View dimView;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  applyBrightness(Prefs.brightness(this));
              }

              @Override
              public boolean onUnbind(Intent intent) {
                  instance = null;
                  removeDim();
                  return super.onUnbind(intent);
              }

              @Override
              public void onDestroy() {
                  removeDim();
                  super.onDestroy();
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) { }

              @Override
              public void onInterrupt() { }

              // "Brilho" por software: uma camada preta transparente sobre toda a tela.
              // Nao mexe na luz de fundo real da TV (o Android nao permite isso a apps).
              void applyBrightness(int level) {
                  if (level >= 100) {
                      removeDim();
                      return;
                  }
                  float alpha = (100 - level) / 100f;
                  try {
                      if (dimView == null) {
                          WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                          View v = new View(this);
                          v.setBackgroundColor(0xFF000000);
                          WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                          | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                          | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                          | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                                  PixelFormat.TRANSLUCENT);
                          wm.addView(v, lp);
                          dimView = v;
                      }
                      dimView.setAlpha(alpha);
                  } catch (Exception e) {
                      dimView = null;
                  }
              }

              private void removeDim() {
                  if (dimView == null) return;
                  try {
                      WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                      wm.removeView(dimView);
                  } catch (Exception e) {
                      // ja removida
                  }
                  dimView = null;
              }

              @Override
              protected boolean onKeyEvent(KeyEvent event) {
                  // Nunca consumir volume: a TV/sistema precisa receber todos os eventos
                  // repetidos durante o pressionamento longo do controle remoto.
                  int code = event.getKeyCode();
                  if (code == KeyEvent.KEYCODE_VOLUME_UP
                          || code == KeyEvent.KEYCODE_VOLUME_DOWN
                          || code == KeyEvent.KEYCODE_VOLUME_MUTE) return false;

                  // Os demais botoes seguem normalmente para o sistema.
                  if (MainActivity.visible) return false;
                  if (!Prefs.keys(this).contains(code)) return false;

                  if (event.getAction() == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0) {
                      PanelActivity open = PanelActivity.current;
                      if (open != null) {
                          open.finish();
                      } else {
                          Intent i = new Intent(this, PanelActivity.class);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_NO_ANIMATION);
                          startActivity(i);
                      }
                  }
                  return true;
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/PanelActivity.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.TextClock;
          import android.widget.Toast;

          public class PanelActivity extends Activity {
              static PanelActivity current;

              private static final int ACCENT = 0xFF3D7BFF;
              private static final int STEP = 5;

              private LinearLayout panel;
              private View first;
              private int level;
              private TextView levelText;
              private BarView bar;

              private int dp(int v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v,
                          getResources().getDisplayMetrics());
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  current = this;
                  level = Prefs.brightness(this);

                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_DIM_BEHIND);
                  getWindow().setDimAmount(0.35f);

                  FrameLayout root = new FrameLayout(this);
                  root.setOnClickListener(v -> finish());

                  panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(dp(14), dp(14), dp(14), dp(14));
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0xE6080A0E);
                  bg.setCornerRadius(dp(28));
                  bg.setStroke(dp(1), 0x3D8B9BB3);
                  panel.setBackground(bg);

                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          dp(420), ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.END | Gravity.CENTER_VERTICAL);
                  lp.rightMargin = dp(28);
                  root.addView(panel, lp);

                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  header.setPadding(dp(14), dp(6), dp(14), dp(10));

                  TextView caption = new TextView(this);
                  caption.setText("ramonzk!");
                  caption.setTextSize(TypedValue.COMPLEX_UNIT_SP, 18);
                  caption.setTextColor(0xFFFFFFFF);
                  caption.setTypeface(android.graphics.Typeface.create("sans-serif-medium",
                          android.graphics.Typeface.NORMAL));
                  caption.setLetterSpacing(0.04f);
                  header.addView(caption, new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  TextClock clock = new TextClock(this);
                  clock.setFormat24Hour("HH:mm");
                  clock.setFormat12Hour("HH:mm");
                  clock.setTextSize(TypedValue.COMPLEX_UNIT_SP, 16);
                  clock.setTextColor(0xFFB8C0CC);
                  header.addView(clock);
                  panel.addView(header);

                  // Ordem solicitada: Brilho, Tela e imagem, Protetor de tela, Wi-Fi, Configurações.
                  brightnessRow();
                  row(IconView.SCREEN, "Tela e imagem",
                          () -> open(new Intent(Settings.ACTION_DISPLAY_SETTINGS)));
                  row(IconView.CLOCK, "Protetor de tela", this::startScreensaver);
                  row(IconView.WIFI, "Wi-Fi", () -> open(new Intent(Settings.ACTION_WIFI_SETTINGS)));
                  row(IconView.GEAR, "Configurações", () -> open(new Intent(Settings.ACTION_SETTINGS)));

                  panel.setAlpha(0f);
                  panel.setTranslationX(dp(40));
                  setContentView(root);
                  panel.animate().alpha(1f).translationX(0f).setDuration(200).start();
                  if (first != null) first.requestFocus();
              }

              @Override
              protected void onDestroy() {
                  if (current == this) current = null;
                  super.onDestroy();
              }

              private GradientDrawable rowBg(boolean focused) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(focused ? 0xE6102034 : 0x180FFFFFF);
                  if (focused) d.setStroke(dp(1), 0xFF168BFF); else d.setStroke(dp(1), 0x182F4052);
                  d.setCornerRadius(dp(16));
                  return d;
              }

              private void focusStyle(View v) {
                  v.setBackground(rowBg(false));
                  v.setOnFocusChangeListener((view, hasFocus) -> {
                      view.setBackground(rowBg(hasFocus));
                      float s = hasFocus ? 1.04f : 1f;
                      view.animate().scaleX(s).scaleY(s).setDuration(120).start();
                  });
              }

              private void addToPanel(View v) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  p.bottomMargin = dp(8);
                  panel.addView(v, p);
                  if (first == null) first = v;
              }

              private TextView label(String s) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, 20);
                  t.setTextColor(0xFFFFFFFF);
                  return t;
              }

              private void row(int icon, String text, Runnable action) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(dp(18), dp(18), dp(18), dp(18));

                  row.addView(new IconView(this, icon), new LinearLayout.LayoutParams(dp(26), dp(26)));
                  LinearLayout.LayoutParams tp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  tp.leftMargin = dp(16);
                  row.addView(label(text), tp);

                  row.setFocusable(true);
                  row.setOnClickListener(v -> action.run());
                  focusStyle(row);
                  addToPanel(row);
              }

              private void brightnessRow() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(18), dp(16), dp(18), dp(12));

                  LinearLayout top = new LinearLayout(this);
                  top.setOrientation(LinearLayout.HORIZONTAL);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.addView(new IconView(this, IconView.SUN), new LinearLayout.LayoutParams(dp(26), dp(26)));

                  LinearLayout.LayoutParams tp = new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT);
                  tp.leftMargin = dp(16);
                  tp.weight = 1f;
                  top.addView(label("Brilho"), tp);

                  levelText = label("");
                  levelText.setTextSize(TypedValue.COMPLEX_UNIT_SP, 16);
                  top.addView(levelText);
                  box.addView(top);

                  bar = new BarView(this);
                  LinearLayout.LayoutParams bp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(8));
                  bp.topMargin = dp(10);
                  box.addView(bar, bp);
                  updateLevel();

                  box.setFocusable(true);
                  box.setOnKeyListener((v, keyCode, event) -> {
                      if (event.getAction() != KeyEvent.ACTION_DOWN) return false;
                      if (keyCode == KeyEvent.KEYCODE_DPAD_LEFT) {
                          setLevel(level - STEP);
                          return true;
                      }
                      if (keyCode == KeyEvent.KEYCODE_DPAD_RIGHT) {
                          setLevel(level + STEP);
                          return true;
                      }
                      return false;
                  });
                  focusStyle(box);
                  addToPanel(box);
              }

              private void setLevel(int value) {
                  int v = Math.max(Prefs.MIN_BRIGHTNESS, Math.min(100, value));
                  if (v == level) return;
                  PanelService s = PanelService.instance;
                  if (s == null) {
                      Toast.makeText(this, "Serviço não está ativo", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  level = v;
                  Prefs.saveBrightness(this, level);
                  s.applyBrightness(level);
                  updateLevel();
              }

              private void updateLevel() {
                  levelText.setText(level + "%");
                  bar.setFraction((level - Prefs.MIN_BRIGHTNESS) / (float) (100 - Prefs.MIN_BRIGHTNESS));
              }

              // No Android 14 o atalho antigo do sistema virou um "stub" que nao faz nada.
              // O caminho que funciona e a acao SLEEP das Configuracoes da TV.
              private void startScreensaver() {
                  Intent i = new Intent("com.google.android.pano.action.SLEEP");
                  i.setClassName("com.android.tv.settings",
                          "com.android.tv.settings.device.display.daydream.DaydreamVoiceAction");
                  if (tryStart(i)) return;
                  if (tryStart(new Intent("com.google.android.pano.action.SLEEP"))) return;
                  Toast.makeText(this, "Não disponível nesta TV", Toast.LENGTH_SHORT).show();
              }

              private boolean tryStart(Intent i) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      startActivity(i);
                      finish();
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private void open(Intent i) {
                  if (!tryStart(i)) {
                      Toast.makeText(this, "Não disponível nesta TV", Toast.LENGTH_SHORT).show();
                  }
              }
          }

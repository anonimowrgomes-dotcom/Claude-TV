              android:notificationTimeout="100"
              android:description="@string/service_description" />
          EOF_FILE
          cat > painel/app/src/main/res/values/strings.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Painel Lateral</string>
              <string name="service_description">Abre o painel lateral quando o botão escolhido do controle é apertado.</string>
          </resources>
          EOF_FILE
          cat > painel/app/src/main/res/values/styles.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="HomeTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/Prefs.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.content.Context;

          import java.util.LinkedHashSet;
          import java.util.Set;

          final class Prefs {
              static final int DEFAULT_KEY = 176;

              private Prefs() { }

              static Set<Integer> keys(Context c) {
                  String s = c.getSharedPreferences("painel", Context.MODE_PRIVATE)
                          .getString("keys", String.valueOf(DEFAULT_KEY));
                  Set<Integer> r = new LinkedHashSet<>();
                  for (String p : s.split(",")) {
                      try {
                          r.add(Integer.parseInt(p.trim()));
                      } catch (NumberFormatException e) {
                          // ignora valor invalido
                      }
                  }
                  return r;
              }

              static void save(Context c, Set<Integer> keys) {
                  StringBuilder sb = new StringBuilder();
                  for (int k : keys) {
                      if (sb.length() > 0) sb.append(',');
                      sb.append(k);
                  }
                  c.getSharedPreferences("painel", Context.MODE_PRIVATE)
                          .edit().putString("keys", sb.toString()).apply();
              }

              static final int MIN_BRIGHTNESS = 20;

              static int brightness(Context c) {
                  int v = c.getSharedPreferences("painel", Context.MODE_PRIVATE).getInt("brightness", 100);
                  return Math.max(MIN_BRIGHTNESS, Math.min(100, v));
              }

              static void saveBrightness(Context c, int level) {
                  c.getSharedPreferences("painel", Context.MODE_PRIVATE)
                          .edit().putInt("brightness", level).apply();
              }

              // Botoes que nunca podem ser capturados: navegacao, voltar, home, volume, power.
              static boolean allowed(int code) {
                  switch (code) {
                      case 3:
                      case 4:
                      case 19:
                      case 20:
                      case 21:
                      case 22:
                      case 23:
                      case 24:
                      case 25:
                      case 26:
                      case 66:
                      case 164:
                          return false;
                      default:
                          return code > 0;
                  }
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/IconView.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.view.View;

          final class IconView extends View {
              static final int WIFI = 0;
              static final int SCREEN = 1;
              static final int CLOCK = 2;
              static final int GEAR = 3;
              static final int SUN = 4;
              static final int GRID = 5;
              static final int PLUS = 6;

              private final int type;
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF r = new RectF();

              IconView(Context c, int type) {
                  super(c);
                  this.type = type;
                  p.setStrokeCap(Paint.Cap.ROUND);
                  p.setColor(0xFFFFFFFF);
              }

              @Override
              protected void onDraw(Canvas c) {
                  float w = getWidth();
                  float h = getHeight();
                  float u = Math.min(w, h) / 24f;
                  float cx = w / 2f;
                  float cy = h / 2f;
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(2f * u);

                  switch (type) {
                      case WIFI: {
                          float by = cy + 7f * u;
                          for (int i = 1; i <= 3; i++) {
                              float rad = i * 5.2f * u;
                              r.set(cx - rad, by - rad, cx + rad, by + rad);
                              c.drawArc(r, -135f, 90f, false, p);
                          }
                          p.setStyle(Paint.Style.FILL);
                          c.drawCircle(cx, by, 1.7f * u, p);
                          break;
                      }
                      case SCREEN: {
                          r.set(cx - 10f * u, cy - 8f * u, cx + 10f * u, cy + 4f * u);
                          c.drawRoundRect(r, 2.5f * u, 2.5f * u, p);
                          c.drawLine(cx, cy + 4f * u, cx, cy + 8f * u, p);
                          c.drawLine(cx - 4.5f * u, cy + 8f * u, cx + 4.5f * u, cy + 8f * u, p);
                          break;
                      }
                      case CLOCK: {
                          c.drawCircle(cx, cy, 9f * u, p);
                          c.drawLine(cx, cy, cx, cy - 5.5f * u, p);
                          c.drawLine(cx, cy, cx + 4f * u, cy + 2.5f * u, p);
                          break;
                      }
                      case GRID: {
                          p.setStyle(Paint.Style.FILL);
                          for (int ix = -1; ix <= 1; ix++) {
                              for (int iy = -1; iy <= 1; iy++) {
                                  c.drawCircle(cx + ix * 6.5f * u, cy + iy * 6.5f * u, 2.1f * u, p);
                              }
                          }
                          break;
                      }
                      case PLUS: {
                          p.setStrokeWidth(2.6f * u);
                          c.drawLine(cx - 8f * u, cy, cx + 8f * u, cy, p);
                          c.drawLine(cx, cy - 8f * u, cx, cy + 8f * u, p);
                          break;
                      }
                      case SUN: {
                          c.drawCircle(cx, cy, 4.2f * u, p);
                          for (int i = 0; i < 8; i++) {
                              double a = Math.toRadians(i * 45.0);
                              float dx = (float) Math.cos(a);
                              float dy = (float) Math.sin(a);
                              c.drawLine(cx + dx * 7.5f * u, cy + dy * 7.5f * u,
                                      cx + dx * 10.5f * u, cy + dy * 10.5f * u, p);
                          }
                          break;
                      }
                      default: {
                          c.drawCircle(cx, cy, 6f * u, p);
                          p.setStrokeWidth(2.6f * u);
                          for (int i = 0; i < 8; i++) {
                              double a = Math.toRadians(i * 45.0);
                              float dx = (float) Math.cos(a);
                              float dy = (float) Math.sin(a);
                              c.drawLine(cx + dx * 8f * u, cy + dy * 8f * u,
                                      cx + dx * 10.5f * u, cy + dy * 10.5f * u, p);
                          }
                          p.setStrokeWidth(2f * u);
                          c.drawCircle(cx, cy, 2.2f * u, p);
                          break;
                      }
                  }
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/BarView.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.view.View;

          final class BarView extends View {
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF r = new RectF();
              private float frac = 1f;

              BarView(Context c) {
                  super(c);
              }

              void setFraction(float f) {
                  frac = Math.max(0f, Math.min(1f, f));
                  invalidate();
              }

              @Override
              protected void onDraw(Canvas c) {
                  float w = getWidth();
                  float h = getHeight();
                  float rad = h / 2f;
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(0x40FFFFFF);
                  r.set(0f, 0f, w, h);
                  c.drawRoundRect(r, rad, rad, p);
                  p.setColor(0xFFFFFFFF);
                  r.set(0f, 0f, Math.max(h, w * frac), h);
                  c.drawRoundRect(r, rad, rad, p);
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/Tile.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.content.Context;
          import android.graphics.Outline;
          import android.graphics.Rect;
          import android.graphics.drawable.GradientDrawable;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.ViewOutlineProvider;
          import android.widget.FrameLayout;

          // Bloco focavel com cantos arredondados, anel branco e leve zoom ao receber foco.
          final class Tile extends FrameLayout {
              private final View ring;
              private final boolean oval;
              private final float radius;

              Tile(Context c, boolean oval, float radius, int ringPx) {
                  super(c);
                  this.oval = oval;
                  this.radius = radius;
                  setFocusable(true);
                  setClickable(true);
                  setClipToOutline(true);
                  setOutlineProvider(new ViewOutlineProvider() {
                      @Override
                      public void getOutline(View v, Outline o) {
                          if (Tile.this.oval) {
                              o.setOval(0, 0, v.getWidth(), v.getHeight());
                          } else {
                              o.setRoundRect(0, 0, v.getWidth(), v.getHeight(), Tile.this.radius);
                          }
                      }
                  });
                  ring = new View(c);
                  GradientDrawable g = new GradientDrawable();
                  g.setShape(oval ? GradientDrawable.OVAL : GradientDrawable.RECTANGLE);
                  g.setCornerRadius(radius);
                  g.setColor(0x00000000);
                  g.setStroke(Math.max(ringPx, 3), 0xFF70A8FF);
                  ring.setBackground(g);
                  ring.setAlpha(0f);
                  addView(ring, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
              }

              void setContent(View v, FrameLayout.LayoutParams lp) {
                  addView(v, 0, lp);
              }

              @Override
              protected void onFocusChanged(boolean gained, int direction, Rect previouslyFocusedRect) {
                  super.onFocusChanged(gained, direction, previouslyFocusedRect);
                  float s = gained ? 1.08f : 1f;
                  animate().scaleX(s).scaleY(s).setDuration(130).start();
                  setTranslationZ(gained ? 12f : 0f);
                  ring.setElevation(gained ? 24f : 0f);
                  ring.animate().alpha(gained ? 1f : 0f).setDuration(100).start();
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/Apps.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.drawable.Drawable;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;

          final class Apps {
              static final class Entry {
                  String pkg;
                  String label;
                  Drawable banner;
                  Drawable icon;
                  Intent launch;
              }

              private static final String[] DEFAULT_FAVS = {
                      "com.netflix.ninja",
                      "com.amazon.amazonvideo.livingroom",
                      "com.google.android.youtube.tv",
                      "com.wbd.stream",
                      "com.crunchyroll.crunchyroid",
                      "com.globo.globotv"
              };

              private Apps() { }

              static List<Entry> all(Context c) {
                  PackageManager pm = c.getPackageManager();
                  Intent q = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER);
                  List<ResolveInfo> list = pm.queryIntentActivities(q, 0);
                  List<Entry> out = new ArrayList<>();
                  Set<String> seen = new HashSet<>();
                  for (ResolveInfo ri : list) {
                      String pkg = ri.activityInfo.packageName;
                      if (!seen.add(pkg)) continue;
                      Entry e = new Entry();
                      e.pkg = pkg;
                      e.label = String.valueOf(ri.loadLabel(pm));
                      try {
                          e.banner = ri.activityInfo.loadBanner(pm);
                      } catch (Exception ex) {
                          e.banner = null;
                      }
                      try {
                          e.icon = ri.loadIcon(pm);
                      } catch (Exception ex) {
                          e.icon = null;
                      }
                      Intent li = pm.getLeanbackLaunchIntentForPackage(pkg);
                      if (li == null) li = pm.getLaunchIntentForPackage(pkg);
                      e.launch = li;
                      if (li != null) out.add(e);
                  }
                  Collections.sort(out, new Comparator<Entry>() {
                      @Override
                      public int compare(Entry a, Entry b) {
                          return a.label.compareToIgnoreCase(b.label);
                      }
                  });
                  return out;
              }

              static List<String> favorites(Context c) {
                  String s = c.getSharedPreferences("painel", Context.MODE_PRIVATE).getString("favs", null);
                  List<String> r = new ArrayList<>();
                  if (s == null) {
                      Collections.addAll(r, DEFAULT_FAVS);
                  } else {
                      for (String p : s.split(",")) {
                          if (!p.trim().isEmpty()) r.add(p.trim());
                      }
                  }
                  return r;
              }

              static void saveFavorites(Context c, List<String> favs) {
                  StringBuilder sb = new StringBuilder();
                  for (String f : favs) {
                      if (sb.length() > 0) sb.append(',');
                      sb.append(f);
                  }
                  c.getSharedPreferences("painel", Context.MODE_PRIVATE)
                          .edit().putString("favs", sb.toString()).apply();
              }

              // Mesma ordem da tela inicial: ordem salva, sem os apps escondidos.
              static List<Entry> ordered(Context c) {
                  SharedPreferences prefs = c.getSharedPreferences("launcher_apps", Context.MODE_PRIVATE);
                  Set<String> hidden = new HashSet<>(prefs.getStringSet("hidden", new HashSet<String>()));
                  List<Entry> installed = all(c);
                  Map<String, Entry> by = new HashMap<>();
                  for (Entry e : installed) by.put(e.pkg, e);
                  List<Entry> out = new ArrayList<>();
                  String saved = prefs.getString("order", "");
                  if (!saved.isEmpty()) {
                      for (String pkg : saved.split("\\|")) {
                          Entry e = by.get(pkg);
                          if (e != null && !hidden.contains(pkg) && !out.contains(e)) out.add(e);
                      }
                  }
                  for (Entry e : installed) {
                      if (!hidden.contains(e.pkg) && !out.contains(e)) out.add(e);
                  }
                  return out;
              }

              static void saveOrder(Context c, List<Entry> list) {
                  StringBuilder sb = new StringBuilder();
                  for (Entry e : list) {
                      if (sb.length() > 0) sb.append('|');
                      sb.append(e.pkg);
                  }
                  c.getSharedPreferences("launcher_apps", Context.MODE_PRIVATE)
                          .edit().putString("order", sb.toString()).apply();
              }

              static void launch(Context c, Entry e) {
                  try {
                      e.launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      c.startActivity(e.launch);
                  } catch (Exception ex) {
                      // app indisponivel
                  }
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/ClockDream.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.service.dreams.DreamService;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.TextClock;

          public class ClockDream extends DreamService {
              @Override
              public void onAttachedToWindow() {
                  super.onAttachedToWindow();
                  setInteractive(false);
                  setFullscreen(true);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);

                  TextClock clock = new TextClock(this);
                  clock.setFormat24Hour("HH:mm");
                  clock.setFormat12Hour("HH:mm");
                  clock.setTextColor(Color.WHITE);
                  clock.setTextSize(TypedValue.COMPLEX_UNIT_SP, 22);
                  clock.setTypeface(Typeface.create("sans-serif-light", Typeface.NORMAL));

                  float d = getResources().getDisplayMetrics().density;
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP | Gravity.END);
                  lp.topMargin = (int) (28 * d);
                  lp.rightMargin = (int) (36 * d);
                  root.addView(clock, lp);

                  setContentView(root);
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/PanelService.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.PixelFormat;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;

          public class PanelService extends AccessibilityService {
              static PanelService instance;

              private View dimView;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  applyBrightness(Prefs.brightness(this));
              }

              @Override
              public boolean onUnbind(Intent intent) {
                  instance = null;
                  removeDim();
                  return super.onUnbind(intent);
              }

              @Override
              public void onDestroy() {
                  removeDim();
                  super.onDestroy();
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) { }

              @Override
              public void onInterrupt() { }

              // "Brilho" por software: uma camada preta transparente sobre toda a tela.
              // Nao mexe na luz de fundo real da TV (o Android nao permite isso a apps).
              void applyBrightness(int level) {
                  if (level >= 100) {
                      removeDim();
                      return;
                  }
                  float alpha = (100 - level) / 100f;
                  try {
                      if (dimView == null) {
                          WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                          View v = new View(this);
                          v.setBackgroundColor(0xFF000000);
                          WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                          | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                          | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                          | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                                  PixelFormat.TRANSLUCENT);
                          wm.addView(v, lp);
                          dimView = v;
                      }
                      dimView.setAlpha(alpha);
                  } catch (Exception e) {
                      dimView = null;
                  }
              }

              private void removeDim() {
                  if (dimView == null) return;
                  try {
                      WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                      wm.removeView(dimView);
                  } catch (Exception e) {
                      // ja removida
                  }
                  dimView = null;
              }

              @Override
              protected boolean onKeyEvent(KeyEvent event) {
                  // Todos os outros botoes seguem normalmente para o sistema.
                  if (MainActivity.visible) return false;
                  if (!Prefs.keys(this).contains(event.getKeyCode())) return false;

                  if (event.getAction() == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0) {
                      PanelActivity open = PanelActivity.current;
                      if (open != null) {
                          open.finish();
                      } else {
                          Intent i = new Intent(this, PanelActivity.class);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_NO_ANIMATION);
                          startActivity(i);
                      }
                  }
                  return true;
              }
          }
          EOF_FILE

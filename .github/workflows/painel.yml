                      t.setContent(content(e), new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                      t.setOnClickListener(v -> {
                          if (pick) {
                              List<String> f = Apps.favorites(this);
                              if (!f.contains(e.pkg)) f.add(e.pkg);
                              Apps.saveFavorites(this, f);
                              finish();
                          } else {
                              Apps.launch(this, e);
                          }
                      });
                      addCard(row, t);
                      n++;
                  }
                  if (n == 0) {
                      TextView t = new TextView(this);
                      t.setText("Nenhum app para adicionar.");
                      t.setTextColor(0xFF8C95A5);
                      t.setTextSize(TypedValue.COMPLEX_UNIT_PX, w * 0.0125f);
                      column.addView(t);
                  }
              }

              private void addInputs() {
                  try {
                      TvInputManager tm = (TvInputManager) getSystemService(Context.TV_INPUT_SERVICE);
                      if (tm == null) return;
                      LinearLayout row = null;
                      int n = 0;
                      for (TvInputInfo info : tm.getTvInputList()) {
                          if (!info.isPassthroughInput()) continue;
                          CharSequence label = info.loadCustomLabel(this);
                          if (label == null || label.length() == 0) label = info.loadLabel(this);
                          final Uri uri = TvContract.buildChannelUriForPassthroughInput(info.getId());
                          if (n % COLUMNS == 0) row = newRow();
                          Tile t = newTile();
                          TextView tv = new TextView(this);
                          tv.setText(String.valueOf(label));
                          tv.setTextColor(0xFFFFFFFF);
                          tv.setGravity(Gravity.CENTER);
                          tv.setBackgroundColor(CARD_BG);
                          tv.setTextSize(TypedValue.COMPLEX_UNIT_PX, w * 0.0125f);
                          t.setContent(tv, new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          t.setOnClickListener(v -> {
                              try {
                                  Intent i = new Intent(Intent.ACTION_VIEW, uri);
                                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(i);
                              } catch (Exception ex) {
                                  Toast.makeText(this, "Não disponível nesta TV", Toast.LENGTH_SHORT).show();
                              }
                          });
                          addCard(row, t);
                          n++;
                      }
                  } catch (Exception e) {
                      // sem entradas disponiveis
                  }
              }

              private View content(Apps.Entry e) {
                  if (e.banner != null) {
                      ImageView iv = new ImageView(this);
                      iv.setScaleType(ImageView.ScaleType.CENTER_CROP);
                      iv.setImageDrawable(e.banner);
                      return iv;
                  }
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.CENTER);
                  box.setBackgroundColor(CARD_BG);
                  if (e.icon != null) {
                      ImageView iv = new ImageView(this);
                      iv.setImageDrawable(e.icon);
                      box.addView(iv, new LinearLayout.LayoutParams(px(w * 0.03f), px(w * 0.03f)));
                  }
                  TextView t = new TextView(this);
                  t.setText(e.label);
                  t.setTextColor(0xFFFFFFFF);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_PX, w * 0.0095f);
                  t.setGravity(Gravity.CENTER);
                  box.addView(t);
                  return box;
              }
          }

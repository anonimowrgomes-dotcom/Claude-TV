              private GradientDrawable rowBg(boolean focused) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(focused ? 0x2B2D4A75 : 0x00000000);
                  d.setCornerRadius(dp(16));
                  d.setStroke(focused ? dp(2) : dp(1), focused ? 0xFF68A5FF : 0x003D7BFF);
                  return d;
              }

              private void focusStyle(View v) {
                  v.setBackground(rowBg(false));
                  v.setOnFocusChangeListener((view, hasFocus) -> {
                      GradientDrawable d = rowBg(hasFocus);
                      if (hasFocus) d.setStroke(dp(2), 0xFF68A5FF);
                      view.setBackground(d);
                      float sc = hasFocus ? 1.06f : 1f;
                      view.animate().scaleX(sc).scaleY(sc).setDuration(130).start();
                  });
              }

              private void addToPanel(View v) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(itemW, dp(88));

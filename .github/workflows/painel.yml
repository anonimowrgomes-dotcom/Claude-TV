          cat > painel/app/src/main/java/com/painel/lateral/Prefs.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.content.Context;

          import java.util.LinkedHashSet;
          import java.util.Set;

          final class Prefs {
              static final int DEFAULT_KEY = 176;

              private Prefs() { }

              static Set<Integer> keys(Context c) {
                  String s = c.getSharedPreferences("painel", Context.MODE_PRIVATE)
                          .getString("keys", String.valueOf(DEFAULT_KEY));
                  Set<Integer> r = new LinkedHashSet<>();
                  for (String p : s.split(",")) {
                      try {
                          r.add(Integer.parseInt(p.trim()));
                      } catch (NumberFormatException e) {
                          // ignora valor invalido
                      }
                  }
                  return r;
              }

              static void save(Context c, Set<Integer> keys) {
                  StringBuilder sb = new StringBuilder();
                  for (int k : keys) {
                      if (sb.length() > 0) sb.append(',');
                      sb.append(k);
                  }
                  c.getSharedPreferences("painel", Context.MODE_PRIVATE)
                          .edit().putString("keys", sb.toString()).apply();
              }

              static final int MIN_BRIGHTNESS = 20;

              static int brightness(Context c) {
                  int v = c.getSharedPreferences("painel", Context.MODE_PRIVATE).getInt("brightness", 100);
                  return Math.max(MIN_BRIGHTNESS, Math.min(100, v));
              }

              static void saveBrightness(Context c, int level) {
                  c.getSharedPreferences("painel", Context.MODE_PRIVATE)
                          .edit().putInt("brightness", level).apply();
              }

              // Botoes que nunca podem ser capturados: navegacao, voltar, home, volume, power.
              static boolean allowed(int code) {
                  switch (code) {
                      case 3:
                      case 4:
                      case 19:
                      case 20:
                      case 21:
                      case 22:
                      case 23:
                      case 24:
                      case 25:
                      case 26:
                      case 66:
                      case 164:
                          return false;
                      default:
                          return code > 0;
                  }
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/IconView.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RectF;
          import android.view.View;

          final class IconView extends View {
              static final int WIFI = 0;
              static final int SCREEN = 1;
              static final int CLOCK = 2;
              static final int GEAR = 3;
              static final int SUN = 4;
              static final int GRID = 5;
              static final int PLUS = 6;
              static final int VOLUME = 7;

              private final int type;
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF r = new RectF();

              IconView(Context c, int type) {
                  super(c);
                  this.type = type;
                  p.setStrokeCap(Paint.Cap.ROUND);
                  p.setColor(0xFFFFFFFF);
              }

              @Override
              protected void onDraw(Canvas c) {
                  float w = getWidth();
                  float h = getHeight();
                  float u = Math.min(w, h) / 24f;
                  float cx = w / 2f;
                  float cy = h / 2f;
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(2f * u);

                  switch (type) {
                      case WIFI: {
                          float by = cy + 7f * u;
                          for (int i = 1; i <= 3; i++) {
                              float rad = i * 5.2f * u;
                              r.set(cx - rad, by - rad, cx + rad, by + rad);
                              c.drawArc(r, -135f, 90f, false, p);
                          }
                          p.setStyle(Paint.Style.FILL);
                          c.drawCircle(cx, by, 1.7f * u, p);
                          break;
                      }
                      case SCREEN: {
                          r.set(cx - 10f * u, cy - 8f * u, cx + 10f * u, cy + 4f * u);
                          c.drawRoundRect(r, 2.5f * u, 2.5f * u, p);
                          c.drawLine(cx, cy + 4f * u, cx, cy + 8f * u, p);
                          c.drawLine(cx - 4.5f * u, cy + 8f * u, cx + 4.5f * u, cy + 8f * u, p);
                          break;
                      }
                      case CLOCK: {
                          c.drawCircle(cx, cy, 9f * u, p);
                          c.drawLine(cx, cy, cx, cy - 5.5f * u, p);
                          c.drawLine(cx, cy, cx + 4f * u, cy + 2.5f * u, p);
                          break;
                      }
                      case GRID: {
                          p.setStyle(Paint.Style.FILL);
                          for (int ix = -1; ix <= 1; ix++) {
                              for (int iy = -1; iy <= 1; iy++) {
                                  c.drawCircle(cx + ix * 6.5f * u, cy + iy * 6.5f * u, 2.1f * u, p);
                              }
                          }
                          break;
                      }
                      case PLUS: {
                          p.setStrokeWidth(2.6f * u);
                          c.drawLine(cx - 8f * u, cy, cx + 8f * u, cy, p);
                          c.drawLine(cx, cy - 8f * u, cx, cy + 8f * u, p);
                          break;
                      }
                      case VOLUME: {
                          p.setStrokeJoin(Paint.Join.ROUND);
                          Path sp = new Path();
                          sp.moveTo(cx - 9f * u, cy - 3.5f * u);
                          sp.lineTo(cx - 5f * u, cy - 3.5f * u);
                          sp.lineTo(cx, cy - 8f * u);
                          sp.lineTo(cx, cy + 8f * u);
                          sp.lineTo(cx - 5f * u, cy + 3.5f * u);
                          sp.lineTo(cx - 9f * u, cy + 3.5f * u);
                          sp.close();
                          c.drawPath(sp, p);
                          for (int i = 1; i <= 2; i++) {
                              float rad = (3f + i * 3.2f) * u;
                              r.set(cx + 1f * u - rad, cy - rad, cx + 1f * u + rad, cy + rad);
                              c.drawArc(r, -45f, 90f, false, p);
                          }
                          break;
                      }
                      case SUN: {
                          c.drawCircle(cx, cy, 4.2f * u, p);
                          for (int i = 0; i < 8; i++) {
                              double a = Math.toRadians(i * 45.0);
                              float dx = (float) Math.cos(a);
                              float dy = (float) Math.sin(a);
                              c.drawLine(cx + dx * 7.5f * u, cy + dy * 7.5f * u,
                                      cx + dx * 10.5f * u, cy + dy * 10.5f * u, p);
                          }
                          break;
                      }
                      default: {
                          c.drawCircle(cx, cy, 6f * u, p);
                          p.setStrokeWidth(2.6f * u);
                          for (int i = 0; i < 8; i++) {
                              double a = Math.toRadians(i * 45.0);
                              float dx = (float) Math.cos(a);
                              float dy = (float) Math.sin(a);
                              c.drawLine(cx + dx * 8f * u, cy + dy * 8f * u,
                                      cx + dx * 10.5f * u, cy + dy * 10.5f * u, p);
                          }
                          p.setStrokeWidth(2f * u);
                          c.drawCircle(cx, cy, 2.2f * u, p);
                          break;
                      }
                  }
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/BarView.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.view.View;

          final class BarView extends View {
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF r = new RectF();
              private float frac = 1f;

              BarView(Context c) {
                  super(c);
              }

              void setFraction(float f) {
                  frac = Math.max(0f, Math.min(1f, f));
                  invalidate();
              }

              @Override
              protected void onDraw(Canvas c) {
                  float w = getWidth();
                  float h = getHeight();
                  float rad = h / 2f;
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(0x40FFFFFF);
                  r.set(0f, 0f, w, h);
                  c.drawRoundRect(r, rad, rad, p);
                  p.setColor(0xFFFFFFFF);
                  r.set(0f, 0f, Math.max(h, w * frac), h);
                  c.drawRoundRect(r, rad, rad, p);
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/ReflectRow.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.graphics.PorterDuff;
          import android.graphics.PorterDuffXfermode;
          import android.graphics.RadialGradient;
          import android.graphics.Shader;
          import android.view.View;
          import android.widget.LinearLayout;

          // Fileira de blocos com piso: luz colorida de ambiente embaixo de cada bloco e um reflexo suave,
          // desenhado de cabeca para baixo a cada quadro (acompanha zoom, brilho e rolagem).
          final class ReflectRow extends LinearLayout {
              private final int reflectPx;
              private final int gapPx;
              private final Paint fade = new Paint();
              private final Paint light = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Matrix m = new Matrix();
              private final Shader shader;

              ReflectRow(Context c, int reflectPx, int gapPx) {
                  super(c);
                  this.reflectPx = reflectPx;
                  this.gapPx = gapPx;
                  setOrientation(HORIZONTAL);
                  setClipChildren(false);
                  setClipToPadding(false);
                  setPadding(0, 0, 0, reflectPx);
                  int band = Math.max(1, reflectPx - gapPx);
                  shader = new LinearGradient(0f, 0f, 0f, band,
                          new int[] { 0x40000000, 0x14000000, 0x00000000 },
                          new float[] { 0f, 0.4f, 0.9f }, Shader.TileMode.CLAMP);
                  fade.setXfermode(new PorterDuffXfermode(PorterDuff.Mode.DST_IN));
              }

              @Override
              protected void dispatchDraw(Canvas canvas) {
                  super.dispatchDraw(canvas);
                  int band = reflectPx - gapPx;
                  if (band <= 0) return;
                  long t = getDrawingTime();
                  for (int i = 0; i < getChildCount(); i++) {
                      View ch = getChildAt(i);
                      if (ch.getVisibility() != VISIBLE) continue;
                      // base visual do bloco (considera zoom e deslocamento)
                      float axis = ch.getBottom() + ch.getTranslationY()
                              + ch.getHeight() * (ch.getScaleY() - 1f) / 2f;
                      float pad = ch.getWidth() * 0.15f;
                      float l = ch.getLeft() + ch.getTranslationX() - pad;
                      float r = ch.getRight() + ch.getTranslationX() + pad;
                      float top = axis + gapPx;

                      // luz de ambiente colorida no piso, so abaixo do bloco
                      if (ch instanceof Tile) {
                          int neon = ((Tile) ch).getNeon();
                          int a = ch.isFocused() ? 0x80 : 0x40;
                          float cx = (l + r) / 2f;
                          float rad = ch.getWidth() * 0.6f;
                          canvas.save();
                          canvas.clipRect(l, axis, r, top + band);
                          canvas.translate(cx, axis);
                          canvas.scale(1f, 0.28f);
                          light.setShader(new RadialGradient(0f, 0f, rad,
                                  new int[] { Color.argb(a, Color.red(neon), Color.green(neon), Color.blue(neon)),
                                          Color.argb(0, Color.red(neon), Color.green(neon), Color.blue(neon)) },
                                  null, Shader.TileMode.CLAMP));
                          canvas.drawCircle(0f, 0f, rad, light);
                          canvas.restore();
                      }

                      // reflexo suave
                      // limites inteiros e a mascara de esmaecimento cobrindo a camada inteira,
                      // senao sobrava uma linha fina do reflexo na ultima fileira de pixels.
                      float lyT = (float) Math.floor(top);
                      float lyB = (float) Math.ceil(top + band) + 1f;
                      int save = canvas.saveLayer(l, lyT, r, lyB, null);
                      canvas.save();
                      canvas.translate(0f, gapPx);
                      canvas.scale(1f, -1f, 0f, axis);
                      drawChild(canvas, ch, t);
                      canvas.restore();
                      m.setTranslate(0f, top);
                      shader.setLocalMatrix(m);
                      fade.setShader(shader);
                      canvas.drawRect(l - 1f, lyT - 1f, r + 1f, lyB + 1f, fade);
                      canvas.restoreToCount(save);
                  }
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/Tile.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.animation.ValueAnimator;
          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Outline;
          import android.graphics.Paint;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.graphics.SweepGradient;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.ViewOutlineProvider;
          import android.widget.FrameLayout;
          import android.widget.ImageView;

          // Bloco focavel no estilo neon: borda fina colorida, brilho de vidro e, ao selecionar,
          // anel azul LED com brilho em volta e leve zoom.
          final class Tile extends FrameLayout {
              static final int LED = 0xFF2D8CFF;

              private final FrameLayout holder;
              private final boolean isRound;
              private final Neon neon;
              private ValueAnimator focusAnim;

              Tile(Context c, boolean oval, float radius, int ringPx) {
                  super(c);
                  setFocusable(true);
                  setClickable(true);
                  // O realce quadrado padrao da TV aparecia atras dos botoes redondos.
                  setDefaultFocusHighlightEnabled(false);
                  isRound = oval;
                  final boolean isOval = oval;
                  final float r = radius;
                  if (oval) {
                      // Botoes redondos: tudo recortado no circulo, so o contorno do anel aparece.
                      setClipChildren(true);
                      setClipToOutline(true);
                      setOutlineProvider(new ViewOutlineProvider() {
                          @Override
                          public void getOutline(View v, Outline o) {
                              o.setOval(0, 0, v.getWidth(), v.getHeight());
                          }
                      });
                  } else {
                      setClipChildren(false);
                      setClipToPadding(false);
                  }
                  holder = new FrameLayout(c);
                  holder.setClipToOutline(true);
                  holder.setOutlineProvider(new ViewOutlineProvider() {
                      @Override
                      public void getOutline(View v, Outline o) {
                          if (isOval) {
                              o.setOval(0, 0, v.getWidth(), v.getHeight());
                          } else {
                              o.setRoundRect(0, 0, v.getWidth(), v.getHeight(), r);
                          }
                      }
                  });
                  super.addView(holder, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  neon = new Neon(c, oval, radius, Math.max(ringPx, 3));
                  super.addView(neon, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
              }

              // Fundo do bloco fica dentro do recorte arredondado.
              @Override
              public void setBackground(Drawable d) {
                  if (holder != null) holder.setBackground(d);
                  else super.setBackground(d);
              }

              void setContent(View v, FrameLayout.LayoutParams lp) {
                  holder.addView(v, lp);
              }

              int getNeon() {
                  return neon.idle;
              }

              void setNeon(int color) {
                  neon.setColors(color, 0);
              }

              void setNeon(int color, int color2) {
                  neon.setColors(color, color2);
              }

              @Override
              protected void onFocusChanged(boolean gained, int direction, Rect previouslyFocusedRect) {
                  super.onFocusChanged(gained, direction, previouslyFocusedRect);
                  float s = gained ? 1.08f : 1f;
                  animate().scaleX(s).scaleY(s).setDuration(140).start();
                  if (!isRound) setTranslationZ(gained ? 12f : 0f);
                  if (focusAnim != null) focusAnim.cancel();
                  focusAnim = ValueAnimator.ofFloat(neon.focus, gained ? 1f : 0f);
                  focusAnim.setDuration(150);
                  focusAnim.addUpdateListener(a -> neon.setFocus((Float) a.getAnimatedValue()));
                  focusAnim.start();
              }

              // Bloco de aplicativo no tema neon (usado na tela inicial e no painel).
              static Tile forApp(Context c, Apps.Entry e, float radius, int ringPx, int iconPx) {
                  Tile t = new Tile(c, false, radius, ringPx);
                  View content;
                  if (e.banner != null) {
                      ImageView iv = new ImageView(c);
                      iv.setScaleType(ImageView.ScaleType.CENTER_CROP);
                      iv.setImageDrawable(e.banner);
                      content = iv;
                  } else {
                      FrameLayout box = new FrameLayout(c);
                      box.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                              new int[] { 0xFF252A33, 0xFF11141A }));
                      if (e.icon != null) {
                          ImageView iv = new ImageView(c);
                          iv.setImageDrawable(e.icon);
                          iv.setScaleType(ImageView.ScaleType.FIT_CENTER);
                          box.addView(iv, new FrameLayout.LayoutParams(iconPx, iconPx, Gravity.CENTER));
                      }
                      content = box;
                  }
                  t.setContent(content, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  t.setContent(new Sheen(c), new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  t.setContentDescription(e.label);
                  t.setNeon(neonColor(e.banner != null ? e.banner : e.icon));
                  return t;
              }

              // Cor da borda: a cor predominante da arte do app, no maximo de brilho.
              static int neonColor(Drawable d) {
                  final int fallback = 0xFF8A6CFF;
                  if (d == null) return fallback;
                  try {
                      final int n = 16;
                      Bitmap b = Bitmap.createBitmap(n, n, Bitmap.Config.ARGB_8888);
                      Canvas cv = new Canvas(b);
                      Rect old = d.copyBounds();
                      d.setBounds(0, 0, n, n);
                      d.draw(cv);
                      d.setBounds(old);
                      float[] hsv = new float[3];
                      float sr = 0f, sg = 0f, sb = 0f, sw = 0f;
                      for (int y = 0; y < n; y++) {
                          for (int x = 0; x < n; x++) {
                              int p = b.getPixel(x, y);
                              if (Color.alpha(p) < 128) continue;
                              Color.colorToHSV(p, hsv);
                              float wgt = hsv[1] * hsv[2];
                              wgt *= wgt;
                              sr += Color.red(p) * wgt;
                              sg += Color.green(p) * wgt;
                              sb += Color.blue(p) * wgt;
                              sw += wgt;
                          }
                      }
                      b.recycle();
                      if (sw < 0.5f) return fallback;
                      Color.RGBToHSV((int) (sr / sw), (int) (sg / sw), (int) (sb / sw), hsv);
                      hsv[1] = Math.max(hsv[1], 0.55f);
                      hsv[2] = 1f;
                      return Color.HSVToColor(hsv);
                  } catch (Throwable ex) {
                      return fallback;
                  }
              }

              // Brilho de vidro: faixa de luz no topo e sombra suave embaixo (da profundidade 2.5D).
              private static final class Sheen extends View {
                  private final Paint sp = new Paint();

                  Sheen(Context c) {
                      super(c);
                      setWillNotDraw(false);
                  }

                  @Override
                  protected void onSizeChanged(int w, int h, int ow, int oh) {
                      super.onSizeChanged(w, h, ow, oh);
                      sp.setShader(new LinearGradient(0f, 0f, 0f, h,
                              new int[] { 0x4DFFFFFF, 0x14FFFFFF, 0x00000000, 0x00000000, 0x59000000 },
                              new float[] { 0f, 0.2f, 0.45f, 0.62f, 1f }, Shader.TileMode.CLAMP));
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      c.drawRect(0f, 0f, getWidth(), getHeight(), sp);
                  }
              }

              // Borda neon com degrade e aura suave; com foco vira o anel azul LED com brilho para fora.
              private static final class Neon extends View {
                  private final boolean oval;
                  private final float radius;
                  private final int ringPx;
                  private final float idleW;
                  private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final RectF r = new RectF();
                  int idle = 0xFF8A6CFF;
                  private int idle2 = 0;
                  private Shader edge;
                  private Shader hi;
                  float focus = 0f;

                  Neon(Context c, boolean oval, float radius, int ringPx) {
                      super(c);
                      this.oval = oval;
                      this.radius = radius;
                      this.ringPx = ringPx;
                      this.idleW = Math.max(2f, ringPx * 0.5f);
                      p.setStyle(Paint.Style.STROKE);
                      setWillNotDraw(false);
                  }

                  void setColors(int c1, int c2) {
                      idle = c1;
                      idle2 = c2;
                      rebuildShaders();
                      invalidate();
                  }

                  void setFocus(float f) {
                      focus = f;
                      invalidate();
                  }

                  private void rebuildShaders() {
                      int w = getWidth();
                      int h = getHeight();
                      if (w <= 0 || h <= 0) return;
                      if (idle2 != 0) {
                          edge = new SweepGradient(w / 2f, h / 2f, new int[] { idle, idle2, idle }, null);
                      } else {
                          int dim = (idle & 0x00FFFFFF) | (0x66 << 24);
                          edge = new LinearGradient(0f, 0f, 0f, h, new int[] { idle, dim },
                                  null, Shader.TileMode.CLAMP);
                      }
                      hi = new LinearGradient(0f, 0f, 0f, h * 0.55f, new int[] { 0xA0FFFFFF, 0x00FFFFFF },
                              null, Shader.TileMode.CLAMP);
                  }

                  @Override
                  protected void onSizeChanged(int w, int h, int ow, int oh) {
                      super.onSizeChanged(w, h, ow, oh);
                      rebuildShaders();
                  }

                  private void shape(Canvas c, float rad) {
                      if (oval) c.drawOval(r, p);
                      else c.drawRoundRect(r, rad, rad, p);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      float w = getWidth();
                      float h = getHeight();
                      float f = focus;

                      if (oval) {
                          // somente o contorno: anel colorido em repouso, anel azul LED com foco
                          p.setStrokeWidth(ringPx);
                          p.setShader(edge);
                          p.setColor(idle);
                          p.setAlpha((int) (235 * (1f - f)));
                          r.set(ringPx / 2f, ringPx / 2f, w - ringPx / 2f, h - ringPx / 2f);
                          c.drawOval(r, p);
                          p.setShader(null);
                          if (f > 0.01f) {
                              p.setColor(LED);
                              p.setAlpha((int) (255 * f));
                              c.drawOval(r, p);
                          }
                          return;
                      }

                      // aura neon suave em volta (some quando o anel LED aparece)
                      if (f < 0.99f) {
                          final int na = 4;
                          float st = Math.max(2f, ringPx * 0.35f);
                          p.setShader(null);
                          p.setStrokeWidth(st + 0.6f);
                          p.setColor(idle);
                          for (int i = na; i >= 1; i--) {
                              float e = (i - 0.5f) * st;
                              float k = 1f - (i - 1f) / na;
                              p.setAlpha((int) (255 * 0.22f * (1f - f) * k * k));
                              r.set(-e, -e, w + e, h + e);
                              shape(c, radius + e);
                          }
                      }

                      // borda neon fina, clara em cima e mais escura embaixo
                      p.setStrokeWidth(idleW);
                      p.setShader(edge);
                      p.setColor(idle);
                      p.setAlpha((int) (245 * (1f - f)));
                      r.set(idleW / 2f, idleW / 2f, w - idleW / 2f, h - idleW / 2f);
                      shape(c, Math.max(0f, radius - idleW / 2f));

                      // fio de luz no topo (bisel)
                      if (!oval && hi != null) {
                          float in = idleW * 1.4f;
                          p.setShader(hi);
                          p.setStrokeWidth(Math.max(1f, idleW * 0.6f));
                          p.setColor(0xFFFFFFFF);
                          p.setAlpha((int) (255 * (1f - f * 0.5f)));
                          r.set(in, in, w - in, h - in);
                          shape(c, Math.max(0f, radius - in));
                      }
                      p.setShader(null);
                      if (f <= 0.01f) return;

                      // brilho LED: aneis para fora, cada vez mais fracos
                      final int n = 6;
                      float step = Math.max(2f, ringPx * 0.4f);
                      p.setStrokeWidth(step + 0.6f);
                      p.setColor(LED);
                      for (int i = n; i >= 1; i--) {
                          float e = (i - 0.5f) * step;
                          float k = 1f - (i - 1f) / n;
                          p.setAlpha((int) (255 * 0.42f * f * k * k));
                          r.set(-e, -e, w + e, h + e);
                          shape(c, radius + e);
                      }

                      // anel LED + fio de luz por dentro
                      p.setStrokeWidth(ringPx);
                      p.setColor(LED);
                      p.setAlpha((int) (255 * f));
                      r.set(ringPx / 2f, ringPx / 2f, w - ringPx / 2f, h - ringPx / 2f);
                      shape(c, Math.max(0f, radius - ringPx / 2f));
                      p.setStrokeWidth(Math.max(1f, ringPx * 0.35f));
                      p.setColor(0xFFCFE6FF);
                      p.setAlpha((int) (210 * f));
                      shape(c, Math.max(0f, radius - ringPx / 2f));
                  }
              }
          }

name: Build Painel Lateral
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Criar projeto
        run: |
          mkdir -p painel/app/src/main/java/com/painel/lateral painel/app/src/main/res/xml painel/app/src/main/res/values
          cat > painel/settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'painel'
          include ':app'
          EOF_FILE
          cat > painel/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_FILE
          cat > painel/gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF_FILE
          cat > painel/app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.painel.lateral'
              compileSdk 34

              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }

              defaultConfig {
                  applicationId 'com.painel.lateral'
                  minSdk 26
                  targetSdk 29
                  versionCode 2
                  versionName '1.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_FILE
          cat > painel/app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />

              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".PanelActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:launchMode="singleTask"
                      android:taskAffinity=""
                      android:theme="@android:style/Theme.Translucent.NoTitleBar" />

                  <service
                      android:name=".PanelService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF_FILE
          cat > painel/app/src/main/res/xml/accessibility_config.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canRequestFilterKeyEvents="true"
              android:notificationTimeout="100"
              android:description="@string/service_description" />
          EOF_FILE
          cat > painel/app/src/main/res/values/strings.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Painel Lateral</string>
              <string name="service_description">Abre o painel lateral quando o botão escolhido do controle é apertado.</string>
          </resources>
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/Prefs.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.content.Context;

          import java.util.LinkedHashSet;
          import java.util.Set;

          final class Prefs {
              static final int DEFAULT_KEY = 176;

              private Prefs() { }

              static Set<Integer> keys(Context c) {
                  String s = c.getSharedPreferences("painel", Context.MODE_PRIVATE)
                          .getString("keys", String.valueOf(DEFAULT_KEY));
                  Set<Integer> r = new LinkedHashSet<>();
                  for (String p : s.split(",")) {
                      try {
                          r.add(Integer.parseInt(p.trim()));
                      } catch (NumberFormatException e) {
                          // ignora valor invalido
                      }
                  }
                  return r;
              }

              static void save(Context c, Set<Integer> keys) {
                  StringBuilder sb = new StringBuilder();
                  for (int k : keys) {
                      if (sb.length() > 0) sb.append(',');
                      sb.append(k);
                  }
                  c.getSharedPreferences("painel", Context.MODE_PRIVATE)
                          .edit().putString("keys", sb.toString()).apply();
              }

              // Botoes que nunca podem ser capturados: navegacao, voltar, home, volume, power.
              static boolean allowed(int code) {
                  switch (code) {
                      case 3:
                      case 4:
                      case 19:
                      case 20:
                      case 21:
                      case 22:
                      case 23:
                      case 24:
                      case 25:
                      case 26:
                      case 66:
                      case 164:
                          return false;
                      default:
                          return code > 0;
                  }
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/IconView.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.view.View;

          final class IconView extends View {
              static final int WIFI = 0;
              static final int SCREEN = 1;
              static final int CLOCK = 2;
              static final int GEAR = 3;

              private final int type;
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF r = new RectF();

              IconView(Context c, int type) {
                  super(c);
                  this.type = type;
                  p.setStrokeCap(Paint.Cap.ROUND);
                  p.setColor(0xFFFFFFFF);
              }

              @Override
              protected void onDraw(Canvas c) {
                  float w = getWidth();
                  float h = getHeight();
                  float u = Math.min(w, h) / 24f;
                  float cx = w / 2f;
                  float cy = h / 2f;
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(2f * u);

                  switch (type) {
                      case WIFI: {
                          float by = cy + 7f * u;
                          for (int i = 1; i <= 3; i++) {
                              float rad = i * 5.2f * u;
                              r.set(cx - rad, by - rad, cx + rad, by + rad);
                              c.drawArc(r, -135f, 90f, false, p);
                          }
                          p.setStyle(Paint.Style.FILL);
                          c.drawCircle(cx, by, 1.7f * u, p);
                          break;
                      }
                      case SCREEN: {
                          r.set(cx - 10f * u, cy - 8f * u, cx + 10f * u, cy + 4f * u);
                          c.drawRoundRect(r, 2.5f * u, 2.5f * u, p);
                          c.drawLine(cx, cy + 4f * u, cx, cy + 8f * u, p);
                          c.drawLine(cx - 4.5f * u, cy + 8f * u, cx + 4.5f * u, cy + 8f * u, p);
                          break;
                      }
                      case CLOCK: {
                          c.drawCircle(cx, cy, 9f * u, p);
                          c.drawLine(cx, cy, cx, cy - 5.5f * u, p);
                          c.drawLine(cx, cy, cx + 4f * u, cy + 2.5f * u, p);
                          break;
                      }
                      default: {
                          c.drawCircle(cx, cy, 6f * u, p);
                          p.setStrokeWidth(2.6f * u);
                          for (int i = 0; i < 8; i++) {
                              double a = Math.toRadians(i * 45.0);
                              float dx = (float) Math.cos(a);
                              float dy = (float) Math.sin(a);
                              c.drawLine(cx + dx * 8f * u, cy + dy * 8f * u,
                                      cx + dx * 10.5f * u, cy + dy * 10.5f * u, p);
                          }
                          p.setStrokeWidth(2f * u);
                          c.drawCircle(cx, cy, 2.2f * u, p);
                          break;
                      }
                  }
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/PanelService.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioManager;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.view.KeyEvent;
          import android.view.accessibility.AccessibilityEvent;

          public class PanelService extends AccessibilityService {
              static PanelService instance;

              private static final long REPEAT_DELAY_MS = 350;
              private static final long REPEAT_EVERY_MS = 110;
              private static final long REPEAT_MAX_MS = 8000;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private int volDir = 0;
              private long volStart = 0;

              private final Runnable volRepeat = new Runnable() {
                  @Override
                  public void run() {
                      if (volDir == 0) return;
                      if (SystemClock.uptimeMillis() - volStart > REPEAT_MAX_MS) {
                          volDir = 0;
                          return;
                      }
                      adjustVolume(volDir);
                      handler.postDelayed(this, REPEAT_EVERY_MS);
                  }
              };

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              @Override
              public boolean onUnbind(Intent intent) {
                  instance = null;
                  volDir = 0;
                  handler.removeCallbacks(volRepeat);
                  return super.onUnbind(intent);
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) { }

              @Override
              public void onInterrupt() { }

              private void adjustVolume(int direction) {
                  AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  if (am != null) {
                      am.adjustSuggestedStreamVolume(direction, AudioManager.USE_DEFAULT_STREAM_TYPE,
                              AudioManager.FLAG_SHOW_UI);
                  }
              }

              // O filtro de botoes do Android perde a repeticao ao segurar o volume.
              // Aqui o volume e tratado com repeticao propria, como o sistema faria.
              private boolean handleVolume(KeyEvent event) {
                  int code = event.getKeyCode();
                  if (code != KeyEvent.KEYCODE_VOLUME_UP && code != KeyEvent.KEYCODE_VOLUME_DOWN) {
                      return false;
                  }
                  int dir = code == KeyEvent.KEYCODE_VOLUME_UP
                          ? AudioManager.ADJUST_RAISE : AudioManager.ADJUST_LOWER;
                  if (event.getAction() == KeyEvent.ACTION_DOWN) {
                      if (event.getRepeatCount() == 0) {
                          handler.removeCallbacks(volRepeat);
                          volDir = dir;
                          volStart = SystemClock.uptimeMillis();
                          adjustVolume(dir);
                          handler.postDelayed(volRepeat, REPEAT_DELAY_MS);
                      }
                  } else {
                      volDir = 0;
                      handler.removeCallbacks(volRepeat);
                  }
                  return true;
              }

              @Override
              protected boolean onKeyEvent(KeyEvent event) {
                  if (handleVolume(event)) return true;

                  // Todos os outros botoes seguem normalmente para o sistema.
                  if (MainActivity.visible) return false;
                  if (!Prefs.keys(this).contains(event.getKeyCode())) return false;

                  if (event.getAction() == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0) {
                      PanelActivity open = PanelActivity.current;
                      if (open != null) {
                          open.finish();
                      } else {
                          Intent i = new Intent(this, PanelActivity.class);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_NO_ANIMATION);
                          startActivity(i);
                      }
                  }
                  return true;
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/PanelActivity.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class PanelActivity extends Activity {
              static PanelActivity current;

              private static final int ACCENT = 0xFF3D7BFF;

              private LinearLayout panel;
              private View first;

              private int dp(int v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v,
                          getResources().getDisplayMetrics());
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  current = this;

                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_DIM_BEHIND);
                  getWindow().setDimAmount(0.35f);

                  FrameLayout root = new FrameLayout(this);
                  root.setOnClickListener(v -> finish());

                  panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(dp(14), dp(14), dp(14), dp(14));
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0xD9111419);
                  bg.setCornerRadius(dp(28));
                  bg.setStroke(dp(1), 0x33FFFFFF);
                  panel.setBackground(bg);

                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          dp(300), ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.END | Gravity.CENTER_VERTICAL);
                  lp.rightMargin = dp(28);
                  root.addView(panel, lp);

                  TextView caption = new TextView(this);
                  caption.setText("ATALHOS");
                  caption.setTextSize(TypedValue.COMPLEX_UNIT_SP, 12);
                  caption.setTextColor(0xFF8C95A5);
                  caption.setLetterSpacing(0.15f);
                  caption.setPadding(dp(14), dp(6), dp(14), dp(10));
                  panel.addView(caption);

                  row(IconView.WIFI, "Wi-Fi", () -> open(new Intent(Settings.ACTION_WIFI_SETTINGS)));
                  row(IconView.SCREEN, "Tela e imagem",
                          () -> open(new Intent(Settings.ACTION_DISPLAY_SETTINGS)));
                  row(IconView.CLOCK, "Protetor de tela", this::startScreensaver);
                  row(IconView.GEAR, "Configurações", () -> open(new Intent(Settings.ACTION_SETTINGS)));

                  panel.setAlpha(0f);
                  panel.setTranslationX(dp(40));
                  setContentView(root);
                  panel.animate().alpha(1f).translationX(0f).setDuration(200).start();
                  if (first != null) first.requestFocus();
              }

              @Override
              protected void onDestroy() {
                  if (current == this) current = null;
                  super.onDestroy();
              }

              private GradientDrawable rowBg(boolean focused) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(focused ? ACCENT : 0x14FFFFFF);
                  d.setCornerRadius(dp(16));
                  return d;
              }

              private void row(int icon, String label, Runnable action) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(dp(16), dp(14), dp(16), dp(14));
                  row.setBackground(rowBg(false));

                  row.addView(new IconView(this, icon), new LinearLayout.LayoutParams(dp(26), dp(26)));

                  TextView t = new TextView(this);
                  t.setText(label);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, 19);
                  t.setTextColor(0xFFFFFFFF);
                  LinearLayout.LayoutParams tp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  tp.leftMargin = dp(16);
                  row.addView(t, tp);

                  row.setFocusable(true);
                  row.setOnClickListener(v -> action.run());
                  row.setOnFocusChangeListener((v, hasFocus) -> {
                      v.setBackground(rowBg(hasFocus));
                      float s = hasFocus ? 1.04f : 1f;
                      v.animate().scaleX(s).scaleY(s).setDuration(120).start();
                  });

                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  p.bottomMargin = dp(6);
                  panel.addView(row, p);
                  if (first == null) first = row;
              }

              private void startScreensaver() {
                  Intent i = new Intent();
                  i.setClassName("com.android.systemui", "com.android.systemui.Somnambulator");
                  open(i);
              }

              private void open(Intent i) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      startActivity(i);
                      finish();
                  } catch (Exception e) {
                      Toast.makeText(this, "Não disponível nesta TV", Toast.LENGTH_SHORT).show();
                  }
              }
          }
          EOF_FILE
          cat > painel/app/src/main/java/com/painel/lateral/MainActivity.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.util.TypedValue;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.LinkedHashSet;
          import java.util.Set;

          public class MainActivity extends Activity {
              static boolean visible;

              private TextView status;
              private TextView keysView;
              private TextView lastView;
              private int lastKey = -1;

              private int dp(int v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v,
                          getResources().getDisplayMetrics());
              }

              private TextView text(ViewGroup parent, String s, int sp) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sp);
                  t.setTextColor(0xFFFFFFFF);
                  t.setPadding(0, dp(8), 0, dp(8));
                  parent.addView(t);
                  return t;
              }

              private void button(ViewGroup parent, String s, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setOnClickListener(l);
                  parent.addView(b);
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(48), dp(32), dp(48), dp(32));
                  root.setBackgroundColor(0xFF101216);
                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(0xFF101216);
                  sv.addView(root);

                  text(root, "Painel Lateral", 28);
                  status = text(root, "", 18);
                  keysView = text(root, "", 18);
                  lastView = text(root, "Aperte um botão do controle para detectá-lo "
                          + "(setas, OK, Voltar, Home e volume são ignorados).", 18);

                  button(root, "Usar o último botão detectado", v -> {
                      if (lastKey > 0 && Prefs.allowed(lastKey)) {
                          Set<Integer> k = new LinkedHashSet<>();
                          k.add(lastKey);
                          Prefs.save(this, k);
                          refresh();
                      }
                  });
                  button(root, "Voltar ao botão padrão (engrenagem)", v -> {
                      Set<Integer> k = new LinkedHashSet<>();
                      k.add(Prefs.DEFAULT_KEY);
                      Prefs.save(this, k);
                      refresh();
                  });
                  button(root, "Testar painel", v -> startActivity(new Intent(this, PanelActivity.class)));
                  button(root, "Abrir configurações de acessibilidade", v -> {
                      try {
                          startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      } catch (Exception e) {
                          // tela indisponivel
                      }
                  });

                  text(root, "Para ativar pelo ATV Tools, rode no Shell:", 16);
                  text(root, "settings put secure enabled_accessibility_services "
                          + "com.painel.lateral/com.painel.lateral.PanelService", 14);
                  text(root, "settings put secure accessibility_enabled 1", 14);

                  setContentView(sv);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  visible = true;
                  refresh();
              }

              @Override
              protected void onPause() {
                  visible = false;
                  super.onPause();
              }

              private void refresh() {
                  String en = Settings.Secure.getString(getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  boolean on = en != null && en.contains(getPackageName());
                  status.setText("Serviço de acessibilidade: " + (on ? "ATIVO" : "desativado"));

                  StringBuilder sb = new StringBuilder();
                  for (int k : Prefs.keys(this)) {
                      if (sb.length() > 0) sb.append(", ");
                      sb.append(KeyEvent.keyCodeToString(k)).append(" (").append(k).append(")");
                  }
                  keysView.setText("Botão que abre o painel: " + sb);
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (Prefs.allowed(keyCode)) {
                      lastKey = keyCode;
                      lastView.setText("Último botão detectado: " + KeyEvent.keyCodeToString(keyCode)
                              + " (código " + keyCode + ")");
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }

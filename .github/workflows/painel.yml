          cat > painel/app/src/main/java/com/painel/lateral/PanelService.java <<'EOF_FILE'
          package com.painel.lateral;

          import android.accessibilityservice.AccessibilityService;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.PixelFormat;
          import android.media.AudioManager;
          import android.media.AudioPlaybackConfiguration;
          import android.media.tv.TvInputInfo;
          import android.media.tv.TvInputManager;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.os.SystemClock;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;

          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          public class PanelService extends AccessibilityService {
              static PanelService instance;

              private View dimView;

              // ---- Protetor de tela automatico ----
              private static final long IDLE_MS = 5 * 60 * 1000L;   // 5 minutos parado
              private static final long CHECK_MS = 15 * 1000L;      // confere a cada 15 segundos
              private final Handler handler = new Handler(Looper.getMainLooper());
              private long lastActivity = SystemClock.elapsedRealtime();
              private boolean dreaming;
              private boolean receiverOn;
              private String fgPackage = "";

              private final Runnable idleCheck = new Runnable() {
                  @Override
                  public void run() {
                      checkIdle();
                      handler.postDelayed(this, CHECK_MS);
                  }
              };

              private final BroadcastReceiver screenReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      noteActivity();
                  }
              };

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  applyBrightness(Prefs.brightness(this));
                  startIdleWatcher();
              }

              @Override
              public boolean onUnbind(Intent intent) {
                  instance = null;
                  stopIdleWatcher();
                  removeDim();
                  return super.onUnbind(intent);
              }

              @Override
              public void onDestroy() {
                  stopIdleWatcher();
                  removeDim();
                  super.onDestroy();
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null || event.getEventType() != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return;
                  // Enquanto o protetor roda, so tecla ou a tela ligar/desligar "acorda" o controle.
                  if (dreaming) return;
                  String cls = event.getClassName() == null ? "" : event.getClassName().toString();
                  String pkg = event.getPackageName() == null ? "" : event.getPackageName().toString();
                  if (cls.contains("Dream")) {
                      dreaming = true;
                      // Escurece bastante durante o descanso usando a mesma camada de brilho.
                      applyBrightness(5);
                      return;
                  }
                  // O proprio painel e a interface do sistema nao contam como "o app em uso".
                  if (pkg.equals(getPackageName()) && cls.endsWith("PanelActivity")) return;
                  if (pkg.equals("com.android.systemui") || pkg.equals("android") || pkg.isEmpty()) return;
                  fgPackage = pkg;
                  lastActivity = SystemClock.elapsedRealtime();
              }

              @Override
              public void onInterrupt() { }

              // "Brilho" por software: uma camada preta transparente sobre toda a tela.
              // Nao mexe na luz de fundo real da TV (o Android nao permite isso a apps).
              void applyBrightness(int level) {
                  if (level >= 100) {
                      removeDim();
                      return;
                  }
                  float alpha = (100 - level) / 100f;
                  try {
                      if (dimView == null) {
                          WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                          View v = new View(this);
                          v.setBackgroundColor(0xFF000000);
                          WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                          | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                          | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                          | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                                  PixelFormat.TRANSLUCENT);
                          wm.addView(v, lp);
                          dimView = v;
                      }
                      dimView.setAlpha(alpha);
                  } catch (Exception e) {
                      dimView = null;
                  }
              }

              private void noteActivity() {
                  lastActivity = SystemClock.elapsedRealtime();
                  if (dreaming) {
                      dreaming = false;
                      // Restaura o nível configurado quando o usuário acorda a TV.
                      applyBrightness(Prefs.brightness(this));
                  }
              }

              private void startIdleWatcher() {
                  noteActivity();
                  if (!receiverOn) {
                      IntentFilter f = new IntentFilter();
                      f.addAction(Intent.ACTION_SCREEN_ON);
                      f.addAction(Intent.ACTION_SCREEN_OFF);
                      try {
                          registerReceiver(screenReceiver, f);
                          receiverOn = true;
                      } catch (Exception e) {
                          receiverOn = false;
                      }
                  }
                  handler.removeCallbacks(idleCheck);
                  handler.postDelayed(idleCheck, CHECK_MS);
              }

              private void stopIdleWatcher() {
                  handler.removeCallbacks(idleCheck);
                  if (receiverOn) {
                      try {
                          unregisterReceiver(screenReceiver);
                      } catch (Exception e) {
                          // ja removido
                      }
                      receiverOn = false;
                  }
              }

              // Liga o protetor de tela depois de 5 minutos sem NENHUM sinal de uso:
              // sem botao do controle, sem troca de janela, sem audio tocando e fora de TV ao vivo / HDMI.
              private void checkIdle() {
                  if (dreaming) return;
                  long now = SystemClock.elapsedRealtime();
                  if (now - lastActivity < IDLE_MS) return;
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (pm != null && !pm.isInteractive()) return;
                  // Modo AUTOMATICO: nunca iniciar descanso enquanto houver reprodução ativa.
                  // A detecção cobre áudio/media ativo e apps/entradas conhecidos de TV ao vivo/HDMI.
                  // A ativação MANUAL continua disponível pelo painel, inclusive durante um vídeo.
                  if (isAudioPlaying() || isWatchingTv()) {
                      lastActivity = now;
                      return;
                  }
                  if (Screensaver.start(this)) {
                      dreaming = true;
                  } else {
                      lastActivity = now;
                  }
              }

              private boolean isAudioPlaying() {
                  AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  if (am == null) return false;
                  try {
                      if (am.isMusicActive()) return true;
                      List<AudioPlaybackConfiguration> list = am.getActivePlaybackConfigurations();
                      return list != null && !list.isEmpty();
                  } catch (Exception e) {
                      return false;
                  }
              }

              // TV ao vivo / HDMI nao passam pelo audio do Android, entao o app em primeiro plano decide.
              private boolean isWatchingTv() {
                  String p = fgPackage;
                  if (p == null || p.isEmpty()) return false;
                  if (p.startsWith("org.droidtv.")
                          || p.equals("com.google.android.tv")
                          || p.equals("com.android.tv")
                          || (p.startsWith("com.android.tv.") && !p.startsWith("com.android.tv.settings"))
                          || p.contains("livetv") || p.contains("playtv") || p.contains("hdmi")
                          || p.contains("tvinput") || p.contains(".tuner")) {
                      return true;
                  }
                  return tvInputPackages().contains(p);
              }

              // Apps que fornecem entradas de TV (canais, HDMI, TV ao vivo) tambem contam como "assistindo".
              private Set<String> tvInputPackages() {
                  Set<String> out = new HashSet<>();
                  try {
                      TvInputManager m = (TvInputManager) getSystemService(Context.TV_INPUT_SERVICE);
                      if (m != null) {
                          for (TvInputInfo info : m.getTvInputList()) {
                              out.add(info.getServiceInfo().packageName);
                          }
                      }
                  } catch (Exception e) {
                      // sem lista: usa so os nomes conhecidos
                  }
                  return out;
              }

              private void removeDim() {
                  if (dimView == null) return;
                  try {
                      WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                      wm.removeView(dimView);
                  } catch (Exception e) {
                      // ja removida
                  }
                  dimView = null;
              }

              @Override
              protected boolean onKeyEvent(KeyEvent event) {
                  noteActivity();
                  // Todos os outros botoes seguem normalmente para o sistema.
                  if (MainActivity.visible) return false;
                  if (!Prefs.keys(this).contains(event.getKeyCode())) return false;

                  if (event.getAction() == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0) {
                      PanelActivity open = PanelActivity.current;
                      if (open != null) {
                          open.finish();
                      } else {
                          Intent i = new Intent(this, PanelActivity.class);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_NO_ANIMATION);
                          startActivity(i);
                      }
                  }
                  return true;
              }
          }
          EOF_FILE

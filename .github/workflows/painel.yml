          public class AllAppsActivity extends Activity {
              private static final int COLUMNS = 5;
              private static final int CARD_BG = 0xFF1F2227;

              private float w;
              private boolean pick;
              private boolean organize;
              private GridLayout grid;
              private List<Apps.Entry> orderList;
              private Tile holding;
              private TextView hint;
              private static final String HINT_IDLE = "Aperte OK em um app, mova com as setas e aperte OK para soltar.";
              private LinearLayout column;
              private View first;

              private int px(float v) {
                  return Math.round(v);
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  pick = getIntent().getBooleanExtra("pick", false);
                  organize = getIntent().getBooleanExtra("organize", false);
                  w = getResources().getDisplayMetrics().widthPixels;

                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(0xFF000000);
                  scroll.setVerticalScrollBarEnabled(false);

                  column = new LinearLayout(this);
                  column.setOrientation(LinearLayout.VERTICAL);
                  int pad = px(w * 0.03f);
                  column.setPadding(pad, px(w * 0.025f), pad, pad);
                  scroll.addView(column);

                  TextView title = new TextView(this);
                  title.setText(organize ? "Organizar aplicativos" : (pick ? "Adicionar à tela inicial" : "Todos os apps"));
                  title.setTextColor(0xFFFFFFFF);
                  title.setTextSize(TypedValue.COMPLEX_UNIT_PX, w * 0.0215f);
                  title.setTypeface(Typeface.create("sans-serif-light", Typeface.NORMAL));
                  title.setPadding(0, 0, 0, px(w * 0.015f));
                  column.addView(title);

                  if (organize) {
                      addOrganize();
                  } else {
                      if (!pick) addInputs();
                      addApps();
                  }

                  setContentView(scroll);
                  if (first != null) first.requestFocus();
              }

              private float cardW() {
                  return (w - px(w * 0.06f)) / COLUMNS - px(w * 0.0066f);
              }

              private LinearLayout newRow() {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setPadding(0, px(w * 0.004f), 0, px(w * 0.004f));
                  column.addView(row);
                  return row;
              }

              private void addCard(LinearLayout row, Tile t) {
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          px(cardW()), px(cardW() * 0.53f));
                  lp.rightMargin = px(w * 0.0066f);
                  row.addView(t, lp);
                  if (first == null) first = t;
              }

              private Tile newTile() {
                  return new Tile(this, false, w * 0.0072f, px(w * 0.0018f) + 2);
              }

              // ---------- modo organizar: mover a ordem dos apps da tela inicial ----------
              private void addOrganize() {
                  orderList = new ArrayList<>(Apps.ordered(this));
                  hint = new TextView(this);
                  hint.setText(HINT_IDLE);
                  hint.setTextColor(0xFF8C95A5);
                  hint.setTextSize(TypedValue.COMPLEX_UNIT_PX, w * 0.0115f);
                  hint.setPadding(0, 0, 0, px(w * 0.012f));
                  column.addView(hint);

                  grid = new GridLayout(this);
                  grid.setColumnCount(COLUMNS);
                  column.addView(grid, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  for (final Apps.Entry e : orderList) {
                      Tile t = newTile();
                      t.setContent(content(e), new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                      t.setOnClickListener(v -> toggleHold((Tile) v));
                      GridLayout.LayoutParams lp = new GridLayout.LayoutParams();
                      lp.width = px(cardW());
                      lp.height = px(cardW() * 0.53f);
                      lp.setMargins(0, px(w * 0.004f), px(w * 0.0066f), px(w * 0.004f));
                      grid.addView(t, lp);
                      if (first == null) first = t;
                  }
              }

              private void toggleHold(Tile t) {
                  if (holding == null) {
                      holding = t;
                      t.animate().translationY(-px(w * 0.008f)).setDuration(120).start();
                      hint.setText("Movendo: use as setas. OK ou Voltar para soltar.");
                  } else {
                      drop();
                  }
              }

              private void drop() {
                  if (holding != null) {
                      holding.animate().translationY(0f).setDuration(120).start();
                      holding = null;
                  }
                  if (hint != null) hint.setText(HINT_IDLE);
              }

              private void moveHeld(int key) {
                  int i = grid.indexOfChild(holding);
                  int n = grid.getChildCount();
                  if (i < 0) return;
                  int j;
                  if (key == KeyEvent.KEYCODE_DPAD_LEFT) j = i - 1;
                  else if (key == KeyEvent.KEYCODE_DPAD_RIGHT) j = i + 1;
                  else if (key == KeyEvent.KEYCODE_DPAD_UP) j = i - COLUMNS;
                  else {
                      j = i + COLUMNS;
                      if (j >= n && i / COLUMNS < (n - 1) / COLUMNS) j = n - 1;
                  }
                  if (j < 0 || j >= n || j == i) return;
                  // Move os outros apps de lugar, e nao o app em foco: o foco nao se perde.
                  if (j > i) {
                      for (int idx = i; idx < j; idx++) {
                          View nb = grid.getChildAt(idx + 1);
                          grid.removeViewAt(idx + 1);
                          grid.addView(nb, idx);
                      }
                  } else {
                      for (int idx = i; idx > j; idx--) {
                          View nb = grid.getChildAt(idx - 1);
                          grid.removeViewAt(idx - 1);
                          grid.addView(nb, idx);
                      }
                  }
                  Apps.Entry moved = orderList.remove(i);
                  orderList.add(j, moved);
                  Apps.saveOrder(this, orderList);
                  keepHeldVisible();
              }

              private void keepHeldVisible() {
                  final View v = holding;
                  if (v == null) return;
                  v.getViewTreeObserver().addOnGlobalLayoutListener(new ViewTreeObserver.OnGlobalLayoutListener() {
                      @Override
                      public void onGlobalLayout() {
                          v.getViewTreeObserver().removeOnGlobalLayoutListener(this);
                          v.requestRectangleOnScreen(new Rect(0, 0, v.getWidth(), v.getHeight()), true);
                      }
                  });
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  if (organize && holding != null) {
                      int k = event.getKeyCode();
                      boolean dirKey = k == KeyEvent.KEYCODE_DPAD_LEFT || k == KeyEvent.KEYCODE_DPAD_RIGHT
                              || k == KeyEvent.KEYCODE_DPAD_UP || k == KeyEvent.KEYCODE_DPAD_DOWN;
                      boolean dropKey = k == KeyEvent.KEYCODE_DPAD_CENTER || k == KeyEvent.KEYCODE_ENTER
                              || k == KeyEvent.KEYCODE_BACK;
                      if (dirKey) {
                          if (event.getAction() == KeyEvent.ACTION_DOWN) moveHeld(k);
                          return true;
                      }
                      if (dropKey) {
                          if (event.getAction() == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0) drop();
                          return true;
                      }
                  }
                  return super.dispatchKeyEvent(event);
              }

              private void addApps() {
                  List<Apps.Entry> list = Apps.all(this);
                  List<String> favs = Apps.favorites(this);
                  LinearLayout row = null;
                  int n = 0;
                  for (final Apps.Entry e : list) {
                      if (pick && favs.contains(e.pkg)) continue;
                      if (n % COLUMNS == 0) row = newRow();
                      Tile t = newTile();
                      t.setContent(content(e), new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                      t.setOnClickListener(v -> {
                          if (pick) {
                              List<String> f = Apps.favorites(this);
                              if (!f.contains(e.pkg)) f.add(e.pkg);
                              Apps.saveFavorites(this, f);
                              finish();
                          } else {
                              Apps.launch(this, e);
                          }
                      });
                      addCard(row, t);
                      n++;
                  }
                  if (n == 0) {
                      TextView t = new TextView(this);
                      t.setText("Nenhum app para adicionar.");
                      t.setTextColor(0xFF8C95A5);
                      t.setTextSize(TypedValue.COMPLEX_UNIT_PX, w * 0.0125f);
                      column.addView(t);
                  }
              }

              private void addInputs() {
                  try {
                      TvInputManager tm = (TvInputManager) getSystemService(Context.TV_INPUT_SERVICE);
                      if (tm == null) return;
                      LinearLayout row = null;
                      int n = 0;
                      for (TvInputInfo info : tm.getTvInputList()) {
                          if (!info.isPassthroughInput()) continue;
                          CharSequence label = info.loadCustomLabel(this);
                          if (label == null || label.length() == 0) label = info.loadLabel(this);
                          final Uri uri = TvContract.buildChannelUriForPassthroughInput(info.getId());
                          if (n % COLUMNS == 0) row = newRow();
                          Tile t = newTile();
                          TextView tv = new TextView(this);
                          tv.setText(String.valueOf(label));
                          tv.setTextColor(0xFFFFFFFF);
                          tv.setGravity(Gravity.CENTER);
                          tv.setBackgroundColor(CARD_BG);
                          tv.setTextSize(TypedValue.COMPLEX_UNIT_PX, w * 0.0125f);
                          t.setContent(tv, new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          t.setOnClickListener(v -> {
                              try {
                                  Intent i = new Intent(Intent.ACTION_VIEW, uri);
                                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(i);
                              } catch (Exception ex) {
                                  Toasts.show(this, "Não disponível nesta TV", Toast.LENGTH_SHORT);
                              }
                          });
                          addCard(row, t);
                          n++;
                      }
                  } catch (Exception e) {
                      // sem entradas disponiveis
                  }
              }

              private View content(Apps.Entry e) {
                  if (e.banner != null) {
                      ImageView iv = new ImageView(this);
                      iv.setScaleType(ImageView.ScaleType.CENTER_CROP);
                      iv.setImageDrawable(e.banner);
                      return iv;
                  }
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.CENTER);
                  box.setBackgroundColor(CARD_BG);
                  if (e.icon != null) {
                      ImageView iv = new ImageView(this);
                      iv.setImageDrawable(e.icon);
                      box.addView(iv, new LinearLayout.LayoutParams(px(w * 0.03f), px(w * 0.03f)));
                  }
                  TextView t = new TextView(this);
                  t.setText(e.label);
                  t.setTextColor(0xFFFFFFFF);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_PX, w * 0.0095f);
                  t.setGravity(Gravity.CENTER);
                  box.addView(t);
                  return box;
              }
          }

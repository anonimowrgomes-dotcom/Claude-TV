              private void beginMoving(Apps.Entry e) {
                  moveMode = true; movingPackage = e.pkg;
                  setTopFocusable(false);
                  lastIndex = Math.max(0, indexOfPackage(e.pkg));
                  Toasts.show(this, "Use ← → para mover; OK para confirmar", Toast.LENGTH_LONG);
                  buildDock();
              }

              private int indexOfPackage(String pkg) { for (int i=0;i<visibleApps.size();i++) if (visibleApps.get(i).pkg.equals(pkg)) return i; return 0; }

              // Enquanto move, os botoes do topo nao podem receber foco (era isso que piscava ao lado do Wi-Fi).
              private void setTopFocusable(boolean on) {
                  if (gearButton != null) gearButton.setFocusable(on);
                  if (wifiButton != null) wifiButton.setFocusable(on);
              }

              // Mantem o app que esta sendo movido visivel, sem animacao, mesmo com movimento rapido.
              private void keepVisible(int index) {
                  int vw = dockScroll.getWidth();
                  if (vw <= 0) vw = (int) w;
                  int step = tileWpx + gapPx;
                  int left = dockPadH + index * step;
                  int right = left + tileWpx;
                  int sx = dockScroll.getScrollX();
                  int target = sx;
                  if (left - dockPadH < sx) target = left - dockPadH;
                  else if (right + dockPadH > sx + vw) target = right + dockPadH - vw;
                  int total = dockPadH * 2 + dock.getChildCount() * step;
                  target = Math.max(0, Math.min(Math.max(0, total - vw), target));
                  if (target != sx) dockScroll.scrollTo(target, 0);
              }

              private void shiftMoving(int delta) {
                  int from = indexOfPackage(movingPackage);
                  int to = from + delta;
                  if (from < 0 || to < 0 || to >= visibleApps.size() || to >= dock.getChildCount()) return;
                  java.util.Collections.swap(visibleApps, from, to);
                  lastIndex = to;
                  // Troca de lugar o vizinho, e nao o app que esta com foco: o foco nunca se perde e nada pisca.
                  View neighbor = dock.getChildAt(to);
                  dock.removeViewAt(to);
                  dock.addView(neighbor, from);
                  StringBuilder sb = new StringBuilder();
                  for (Apps.Entry a : visibleApps) { if (sb.length() > 0) sb.append('|'); sb.append(a.pkg); }
                  getSharedPreferences("launcher_apps", MODE_PRIVATE).edit().putString("order", sb.toString()).apply();
                  keepVisible(to);
              }

              private void finishMoving() { moveMode = false; movingPackage = null; setTopFocusable(true); buildDock(); Toasts.show(this, "Ordem dos aplicativos salva", Toast.LENGTH_SHORT); }

              private void hideApp(Apps.Entry e) {
                  android.content.SharedPreferences p = getSharedPreferences("launcher_apps", MODE_PRIVATE);
                  java.util.Set<String> hidden = new java.util.HashSet<>(p.getStringSet("hidden", new java.util.HashSet<>())); hidden.add(e.pkg);
                  p.edit().putStringSet("hidden", hidden).apply(); lastIndex = 0; buildDock();
              }

              private void showHiddenApps() {
                  android.content.SharedPreferences p = getSharedPreferences("launcher_apps", MODE_PRIVATE);
                  java.util.Set<String> hidden = new java.util.HashSet<>(p.getStringSet("hidden", new java.util.HashSet<>()));
                  List<Apps.Entry> found = new ArrayList<>(); for (Apps.Entry e : Apps.all(this)) if (hidden.contains(e.pkg)) found.add(e);
                  LinearLayout box = new LinearLayout(this); box.setOrientation(LinearLayout.VERTICAL); box.setPadding(px(w*0.018f),px(h*0.015f),px(w*0.018f),px(h*0.015f)); GradientDrawable hiddenDialogBg = new GradientDrawable(); hiddenDialogBg.setColor(0xFF10141C); hiddenDialogBg.setCornerRadius(px(w*0.018f)); box.setBackground(hiddenDialogBg);
                  TextView title = new TextView(this); title.setText("Aplicativos escondidos"); title.setTextColor(0xFFFFFFFF); title.setTextSize(TypedValue.COMPLEX_UNIT_SP,22); title.setPadding(0,0,0,px(h*0.01f)); box.addView(title);
                  AlertDialog d = new AlertDialog.Builder(this).setView(box).create();
                  if (found.isEmpty()) { TextView empty = new TextView(this); empty.setText("Nenhum aplicativo escondido"); empty.setTextColor(0xFFCCCCCC); box.addView(empty); }
                  java.util.ArrayList<View> restoreFocusTargets = new java.util.ArrayList<>();
                  java.util.ArrayList<View> infoFocusTargets = new java.util.ArrayList<>();
                  for (Apps.Entry e : found) {
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setPadding(px(w * 0.008f), px(h * 0.006f), px(w * 0.008f), px(h * 0.006f));
                      GradientDrawable rowBg = new GradientDrawable();
                      rowBg.setColor(0xFF202938);
                      rowBg.setCornerRadius(px(w * 0.008f));
                      row.setBackground(rowBg);
                      row.setFocusable(false);
                      LinearLayout.LayoutParams rowLp = new LinearLayout.LayoutParams(-1, px(h * 0.075f));
                      rowLp.bottomMargin = px(h * 0.006f);
                      box.addView(row, rowLp);

                      // Ícone e nome à esquerda, com recorte arredondado.
                      ImageView appIcon = new ImageView(this);
                      appIcon.setImageDrawable(e.icon);
                      appIcon.setScaleType(ImageView.ScaleType.CENTER_CROP);
                      appIcon.setPadding(0, 0, 0, 0);
                      GradientDrawable appIconBg = new GradientDrawable(); appIconBg.setColor(0xFF30394A); appIconBg.setCornerRadius(px(w * 0.013f));
                      appIcon.setBackground(appIconBg);
                      appIcon.setOutlineProvider(new android.view.ViewOutlineProvider() {
                          @Override public void getOutline(View view, android.graphics.Outline outline) {
                              outline.setRoundRect(0, 0, view.getWidth(), view.getHeight(), px(w * 0.013f));
                          }
                      });
                      appIcon.setClipToOutline(true);
                      LinearLayout.LayoutParams iconLp = new LinearLayout.LayoutParams(px(w * 0.043f), px(w * 0.043f));
                      iconLp.leftMargin = px(w * 0.004f); iconLp.rightMargin = px(w * 0.008f);
                      row.addView(appIcon, iconLp);

                      TextView name = new TextView(this);
                      name.setText(e.label); name.setTextColor(0xFFFFFFFF); name.setTextSize(TypedValue.COMPLEX_UNIT_SP, 17);
                      name.setSingleLine(true); name.setEllipsize(android.text.TextUtils.TruncateAt.END); name.setGravity(Gravity.CENTER_VERTICAL);
                      name.setFocusable(false); name.setClickable(false); name.setImportantForAccessibility(View.IMPORTANT_FOR_ACCESSIBILITY_NO); name.setId(View.generateViewId());
                      name.setOnFocusChangeListener((v, focused) -> { GradientDrawable g = new GradientDrawable(); g.setColor(focused ? 0xFF263B57 : 0xFF202938); g.setCornerRadius(px(w * 0.008f)); g.setStroke(px(focused ? 2 : 0), focused ? 0xFF70C5FF : 0x00000000); row.setBackground(g); });
                      row.addView(name, new LinearLayout.LayoutParams(0, -1, 1f));

                      // Ações à direita, com foco visível para o controle remoto.
                      TextView restore = new TextView(this);
                      restore.setText("↩"); restore.setTextColor(0xFFFFFFFF); restore.setTextSize(TypedValue.COMPLEX_UNIT_SP, 23);
                      restore.setGravity(Gravity.CENTER); restore.setContentDescription("Restaurar " + e.label); restore.setFocusable(true); restore.setClickable(true); restore.setId(View.generateViewId());
                      GradientDrawable restoreBg = new GradientDrawable(); restoreBg.setColor(0xFF315B96); restoreBg.setCornerRadius(px(10)); restoreBg.setStroke(px(1), 0xFF587DB2); restore.setBackground(restoreBg);
                      LinearLayout.LayoutParams restoreLp = new LinearLayout.LayoutParams(px(w * 0.043f), -1); restoreLp.leftMargin = px(w * 0.004f); row.addView(restore, restoreLp);
                      restore.setOnFocusChangeListener((v, focused) -> { GradientDrawable g = new GradientDrawable(); g.setColor(focused ? 0xFF1769AA : 0xFF315B96); g.setCornerRadius(px(10)); g.setStroke(px(focused ? 3 : 1), focused ? 0xFF70C5FF : 0xFF587DB2); restore.setBackground(g); restore.setScaleX(focused ? 1.06f : 1f); restore.setScaleY(focused ? 1.06f : 1f); });
                      restoreFocusTargets.add(restore);
                      restore.setOnClickListener(v -> {
                          java.util.Set<String> hset = new java.util.HashSet<>(getSharedPreferences("launcher_apps", MODE_PRIVATE).getStringSet("hidden", new java.util.HashSet<>()));
                          hset.remove(e.pkg); getSharedPreferences("launcher_apps", MODE_PRIVATE).edit().putStringSet("hidden", hset).apply();
                          d.dismiss(); buildDock(); showHiddenApps();
                      });

                      TextView info = new TextView(this);
                      info.setText("ⓘ"); info.setTextColor(0xFFFFFFFF); info.setTextSize(TypedValue.COMPLEX_UNIT_SP, 21);
                      info.setGravity(Gravity.CENTER); info.setContentDescription("Informações de " + e.label); info.setFocusable(true); info.setClickable(true); info.setId(View.generateViewId());
                      GradientDrawable infoBg = new GradientDrawable(); infoBg.setColor(0xFF343D4D); infoBg.setCornerRadius(px(10)); infoBg.setStroke(px(1), 0xFF596579); info.setBackground(infoBg);
                      LinearLayout.LayoutParams infoLp = new LinearLayout.LayoutParams(px(w * 0.043f), -1); infoLp.leftMargin = px(w * 0.004f); row.addView(info, infoLp);
                      info.setOnFocusChangeListener((v, focused) -> { GradientDrawable g = new GradientDrawable(); g.setColor(focused ? 0xFF1769AA : 0xFF343D4D); g.setCornerRadius(px(10)); g.setStroke(px(focused ? 3 : 1), focused ? 0xFF70C5FF : 0xFF596579); info.setBackground(g); info.setScaleX(focused ? 1.06f : 1f); info.setScaleY(focused ? 1.06f : 1f); });
                      infoFocusTargets.add(info);
                      info.setOnClickListener(v -> openAppInfo(e));
                      // O nome e o ícone são apenas informativos: o foco do controle remoto
                      // entra diretamente nas ações Restaurar e Informações.
                      restore.setNextFocusLeftId(restore.getId());
                      restore.setNextFocusRightId(info.getId());
                      info.setNextFocusLeftId(restore.getId());
                      info.setNextFocusRightId(info.getId());
                  }
                  // Navegação vertical mantém a mesma coluna de ação entre os aplicativos.
                  for (int i = 0; i < restoreFocusTargets.size(); i++) {
                      View restoreTarget = restoreFocusTargets.get(i);
                      View infoTarget = infoFocusTargets.get(i);
                      if (i > 0) {
                          restoreTarget.setNextFocusUpId(restoreFocusTargets.get(i - 1).getId());
                          infoTarget.setNextFocusUpId(infoFocusTargets.get(i - 1).getId());
                      }
                      if (i + 1 < restoreFocusTargets.size()) {
                          restoreTarget.setNextFocusDownId(restoreFocusTargets.get(i + 1).getId());
                          infoTarget.setNextFocusDownId(infoFocusTargets.get(i + 1).getId());
                      }
                  }
                  addMenuButton(box, "Fechar", d::dismiss); d.show(); if (d.getWindow()!=null) { GradientDrawable winBg = new GradientDrawable(); winBg.setColor(0xFF10141C); winBg.setCornerRadius(px(w*0.018f)); d.getWindow().setBackgroundDrawable(winBg); d.getWindow().setLayout((int)(w*0.48f), (int)(h*0.72f)); }
                  if (!found.isEmpty() && !restoreFocusTargets.isEmpty()) restoreFocusTargets.get(0).requestFocus();
              }

              private void openAppInfo(Apps.Entry e) {
                  try { Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + e.pkg)); startActivity(i); }
                  catch (Exception ex) { Toasts.show(this, "Informações do aplicativo indisponíveis", Toast.LENGTH_SHORT); }
              }

              // ================= Plano de fundo personalizado =================

              private File customWallpaperFile() {
                  return new File(getFilesDir(), "wallpaper_custom");
              }

              // Tamanho do painel: o maior modo que a TV informa, nunca menor que 3840x2160 (4K da 65PUG7408/78).
              private int[] panelSize() {
                  int pw = TV_W;
                  int ph = TV_H;
                  try {
                      android.view.Display d = getWindowManager().getDefaultDisplay();
                      for (android.view.Display.Mode m : d.getSupportedModes()) {
                          pw = Math.max(pw, m.getPhysicalWidth());
                          ph = Math.max(ph, m.getPhysicalHeight());
                      }
                  } catch (Exception e) {
                      // usa o padrao 4K
                  }
                  // limite de textura da GPU de TVs
                  return new int[] { Math.min(pw, 4096), Math.min(ph, 4096) };
              }

              private void loadWallpaperAtStart() {
                  final File f = customWallpaperFile();
                  if (!f.exists()) {
                      wallView.setImageResource(R.drawable.wallpaper);
                      return;
                  }
                  new Thread(() -> {
                      final Bitmap b = decodeWallpaper(f);
                      runOnUiThread(() -> {
                          if (isDestroyed()) return;
                          if (b != null) wallView.setImageBitmap(b);
                          else wallView.setImageResource(R.drawable.wallpaper);
                      });
                  }).start();
              }

              // Decodifica sem perder qualidade: so reduz quando a imagem e maior que o painel (4K),
              // porque acima disso a TV nao mostra mais detalhe e a memoria nao aguenta 8K inteiro.
              private Bitmap decodeWallpaper(File f) {
                  final int[] panel = panelSize();
                  try {
                      if (Build.VERSION.SDK_INT >= 28) {
                          final int pw = panel[0];
                          return ImageDecoder.decodeBitmap(ImageDecoder.createSource(f), (decoder, info, src) -> {
                              int iw = info.getSize().getWidth();
                              int ih = info.getSize().getHeight();
                              if (iw > pw) {
                                  decoder.setTargetSize(pw, Math.max(1, Math.round((float) ih * pw / iw)));
                              }
                          });
                      }
                      BitmapFactory.Options bounds = new BitmapFactory.Options();
                      bounds.inJustDecodeBounds = true;
                      BitmapFactory.decodeFile(f.getAbsolutePath(), bounds);
                      int sample = 1;
                      while (bounds.outWidth / (sample * 2) >= panel[0]) sample *= 2;
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inSampleSize = sample;
                      return BitmapFactory.decodeFile(f.getAbsolutePath(), o);
                  } catch (Throwable t) {
                      return null;
                  }
              }

              private void pickWallpaper() {
                  Toasts.show(this, "Escolha uma imagem 16:9, de 1920x1080 até 7680x4320", Toast.LENGTH_LONG);
                  Intent open = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  open.addCategory(Intent.CATEGORY_OPENABLE);
                  open.setType("image/*");
                  try {
                      startActivityForResult(open, REQ_WALLPAPER);
                      return;
                  } catch (Exception e) {
                      // tenta o seletor alternativo
                  }
                  Intent get = new Intent(Intent.ACTION_GET_CONTENT);
                  get.addCategory(Intent.CATEGORY_OPENABLE);
                  get.setType("image/*");
                  try {
                      startActivityForResult(get, REQ_WALLPAPER);
                  } catch (Exception e) {
                      Toasts.show(this, "Esta TV não tem um seletor de arquivos instalado", Toast.LENGTH_LONG);
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_WALLPAPER && resultCode == RESULT_OK && data != null && data.getData() != null) {
                      importWallpaper(data.getData());
                  }
              }

              private void importWallpaper(final Uri uri) {
                  Toasts.show(this, "Aplicando plano de fundo…", Toast.LENGTH_SHORT);
                  new Thread(() -> {
                      final File tmp = new File(getFilesDir(), "wallpaper_tmp");
                      final String error = importWallpaperSync(uri, tmp);
                      final Bitmap bmp = error == null ? decodeWallpaper(tmp) : null;
                      if (error == null && bmp != null) {
                          File dst = customWallpaperFile();
                          if (dst.exists()) dst.delete();
                          tmp.renameTo(dst);
                      } else {
                          tmp.delete();
                      }
                      runOnUiThread(() -> {
                          if (error != null) {
                              showWallpaperError(error);
                          } else if (bmp == null) {
                              showWallpaperError("Não foi possível abrir essa imagem.");
                          } else {
                              wallView.setImageBitmap(bmp);
                              Toasts.show(this, "Plano de fundo alterado", Toast.LENGTH_SHORT);
                          }
                      });
                  }).start();
              }

              // Valida o tamanho e copia o arquivo original, byte a byte (sem recomprimir), para a pasta do app.
              // Retorna null se deu certo, ou o texto do erro.
              private String importWallpaperSync(Uri uri, File tmp) {
                  try {
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      try (InputStream in = getContentResolver().openInputStream(uri)) {
                          if (in == null) return "Não foi possível abrir o arquivo.";
                          BitmapFactory.decodeStream(in, null, o);
                      }
                      int iw = o.outWidth;
                      int ih = o.outHeight;
                      if (iw <= 0 || ih <= 0) return "Esse arquivo não é uma imagem válida.";

                      // fotos giradas (EXIF) trocam largura e altura
                      try (InputStream in = getContentResolver().openInputStream(uri)) {
                          if (in != null) {
                              int ori = new ExifInterface(in).getAttributeInt(
                                      ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL);
                              if (ori == 5 || ori == 6 || ori == 7 || ori == 8) {
                                  int t = iw;
                                  iw = ih;
                                  ih = t;
                              }
                          }
                      } catch (Exception ignore) {
                          // sem EXIF: segue normal
                      }

                      String dims = iw + "x" + ih;
                      float ratio = (float) iw / (float) ih;
                      if (Math.abs(ratio / WALL_ASPECT - 1f) > WALL_TOLERANCE) {
                          return "A imagem tem " + dims + " e não está na proporção 16:9 da TV. "
                                  + "Use, por exemplo, 1920x1080, 3840x2160 ou 7680x4320.";
                      }
                      if (iw < WALL_MIN_W || ih < WALL_MIN_H) {
                          return "A imagem (" + dims + ") é pequena demais e ficaria borrada. O mínimo é "
                                  + WALL_MIN_W + "x" + WALL_MIN_H + ".";
                      }
                      if (iw > WALL_MAX_W || ih > WALL_MAX_H) {
                          return "A imagem (" + dims + ") é grande demais. O máximo é "
                                  + WALL_MAX_W + "x" + WALL_MAX_H + " (8K).";
                      }

                      try (InputStream in = getContentResolver().openInputStream(uri);
                           FileOutputStream out = new FileOutputStream(tmp)) {
                          if (in == null) return "Não foi possível abrir o arquivo.";
                          byte[] buf = new byte[1 << 16];
                          int n;
                          while ((n = in.read(buf)) != -1) out.write(buf, 0, n);
                      }
                      return null;
                  } catch (Exception e) {
                      return "Falha ao ler a imagem.";
                  }
              }

              private void showWallpaperError(String msg) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(px(w*0.018f), px(h*0.018f), px(w*0.018f), px(h*0.012f));
                  box.setBackgroundColor(0xFF10141C);
                  TextView title = new TextView(this);
                  title.setText("Imagem não aceita");
                  title.setTextColor(0xFFFFFFFF);
                  title.setTextSize(TypedValue.COMPLEX_UNIT_SP, 22);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setPadding(0, 0, 0, px(h*0.012f));
                  box.addView(title);
                  TextView body = new TextView(this);
                  body.setText(msg);
                  body.setTextColor(0xFFCCCCCC);
                  body.setTextSize(TypedValue.COMPLEX_UNIT_SP, 18);
                  body.setPadding(0, 0, 0, px(h*0.014f));
                  box.addView(body);
                  AlertDialog dialog = new AlertDialog.Builder(this).setView(box).create();
                  addMenuButton(box, "Escolher outra imagem", () -> { dialog.dismiss(); pickWallpaper(); });
                  addMenuButton(box, "Fechar", dialog::dismiss);
                  dialog.show();
                  if (dialog.getWindow() != null) {
                      dialog.getWindow().setBackgroundDrawableResource(android.R.color.transparent);
                      dialog.getWindow().setLayout((int)(w*0.42f), ViewGroup.LayoutParams.WRAP_CONTENT);
                  }
              }

              private LinearLayout.LayoutParams tileLp(float tw, float th, int gap) {
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(px(tw), px(th));
                  lp.rightMargin = gap;
                  return lp;
              }

              private Tile controlTile(int icon, float radius, int ring, float tw, float th) {

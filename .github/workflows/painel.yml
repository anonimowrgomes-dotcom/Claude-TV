                  private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Path path = new Path();
                  private Shader glowA;
                  private Shader glowB;
                  private Shader waveShader;

                  Bg(Context c) {
                      super(c);
                  }

                  @Override
                  protected void onSizeChanged(int w, int h, int ow, int oh) {
                      super.onSizeChanged(w, h, ow, oh);
                      glowA = new RadialGradient(w * 0.9f, h * 1.05f, w * 0.65f,
                              0x66146BFF, 0x00146BFF, Shader.TileMode.CLAMP);
                      glowB = new RadialGradient(w * 0.05f, h * 0.95f, w * 0.35f,
                              0x33104BD0, 0x00104BD0, Shader.TileMode.CLAMP);
                      waveShader = new LinearGradient(0f, 0f, w, 0f,
                              new int[]{0x00289BFF, 0x66289BFF, 0xAA3DA5FF},
                              new float[]{0f, 0.55f, 1f}, Shader.TileMode.CLAMP);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      float w = getWidth();
                      float h = getHeight();
                      float d = getResources().getDisplayMetrics().density;
                      c.drawColor(0xFF020611);

                      p.setStyle(Paint.Style.FILL);
                      p.setShader(glowA);
                      c.drawRect(0f, 0f, w, h, p);
                      p.setShader(glowB);
                      c.drawRect(0f, 0f, w, h, p);

                      p.setStyle(Paint.Style.STROKE);
                      p.setShader(waveShader);
                      for (int i = 0; i < 4; i++) {
                          float y0 = h * (0.80f + 0.045f * i);
                          p.setStrokeWidth((1.2f + 0.5f * i) * d);
                          p.setAlpha(255 - i * 45);
                          path.reset();
                          path.moveTo(0f, y0);
                          path.cubicTo(w * 0.28f, y0 - h * 0.10f, w * 0.55f, y0 + h * 0.10f,
                                  w, y0 - h * (0.10f + 0.03f * i));
                          c.drawPath(path, p);
                      }
                      p.setShader(null);
                      p.setAlpha(255);
                  }
              }

              // Icones desenhados em codigo (sem arquivos de imagem).
              static final class Ic extends View {
                  static final int GEAR = 0;
                  static final int MONITOR = 1;
                  static final int ACCESS = 2;
                  static final int SERVICE = 3;

                  row.addView(bubble, new LinearLayout.LayoutParams(dp(54), dp(54)));
                  TextView caption = label(text); caption.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13); caption.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams tp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  tp.topMargin = dp(4); row.addView(caption, tp);

                  row.setFocusable(true);
                  row.setOnClickListener(v -> action.run());
                  focusStyle(row);

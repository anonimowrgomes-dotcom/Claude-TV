              private void beginMoving(Apps.Entry e) {
                  moveMode = true; movingPackage = e.pkg;
                  setTopFocusable(false);
                  lastIndex = Math.max(0, indexOfPackage(e.pkg));
                  Toast.makeText(this, "Use ← → para mover; OK para confirmar", Toast.LENGTH_LONG).show();
                  buildDock();
              }

              private int indexOfPackage(String pkg) { for (int i=0;i<visibleApps.size();i++) if (visibleApps.get(i).pkg.equals(pkg)) return i; return 0; }

              // Enquanto move, os botoes do topo nao podem receber foco (era isso que piscava ao lado do Wi-Fi).
              private void setTopFocusable(boolean on) {
                  if (gearButton != null) gearButton.setFocusable(on);
                  if (wifiButton != null) wifiButton.setFocusable(on);
              }

              // Mantem o app que esta sendo movido visivel, sem animacao, mesmo com movimento rapido.
              private void keepVisible(int index) {
                  int vw = dockScroll.getWidth();
                  if (vw <= 0) vw = (int) w;
                  int step = tileWpx + gapPx;
                  int left = dockPadH + index * step;
                  int right = left + tileWpx;
                  int sx = dockScroll.getScrollX();
                  int target = sx;
                  if (left - dockPadH < sx) target = left - dockPadH;
                  else if (right + dockPadH > sx + vw) target = right + dockPadH - vw;
                  int total = dockPadH * 2 + dock.getChildCount() * step;
                  target = Math.max(0, Math.min(Math.max(0, total - vw), target));
                  if (target != sx) dockScroll.scrollTo(target, 0);
              }

              private void shiftMoving(int delta) {
                  int from = indexOfPackage(movingPackage);
                  int to = from + delta;
                  if (from < 0 || to < 0 || to >= visibleApps.size() || to >= dock.getChildCount()) return;
                  java.util.Collections.swap(visibleApps, from, to);
                  lastIndex = to;
                  // Troca de lugar o vizinho, e nao o app que esta com foco: o foco nunca se perde e nada pisca.
                  View neighbor = dock.getChildAt(to);
                  dock.removeViewAt(to);
                  dock.addView(neighbor, from);
                  StringBuilder sb = new StringBuilder();
                  for (Apps.Entry a : visibleApps) { if (sb.length() > 0) sb.append('|'); sb.append(a.pkg); }
                  getSharedPreferences("launcher_apps", MODE_PRIVATE).edit().putString("order", sb.toString()).apply();
                  keepVisible(to);
              }

              private void finishMoving() { moveMode = false; movingPackage = null; setTopFocusable(true); buildDock(); Toast.makeText(this, "Ordem dos aplicativos salva", Toast.LENGTH_SHORT).show(); }

              private void hideApp(Apps.Entry e) {
                  android.content.SharedPreferences p = getSharedPreferences("launcher_apps", MODE_PRIVATE);
                  java.util.Set<String> hidden = new java.util.HashSet<>(p.getStringSet("hidden", new java.util.HashSet<>())); hidden.add(e.pkg);
                  p.edit().putStringSet("hidden", hidden).apply(); lastIndex = 0; buildDock();
              }

              private void showHiddenApps() {
                  android.content.SharedPreferences p = getSharedPreferences("launcher_apps", MODE_PRIVATE);
                  java.util.Set<String> hidden = new java.util.HashSet<>(p.getStringSet("hidden", new java.util.HashSet<>()));
                  List<Apps.Entry> found = new ArrayList<>(); for (Apps.Entry e : Apps.all(this)) if (hidden.contains(e.pkg)) found.add(e);
                  LinearLayout box = new LinearLayout(this); box.setOrientation(LinearLayout.VERTICAL); box.setPadding(px(w*0.018f),px(h*0.015f),px(w*0.018f),px(h*0.015f)); box.setBackgroundColor(0xFF10141C);
                  TextView title = new TextView(this); title.setText("Aplicativos escondidos"); title.setTextColor(0xFFFFFFFF); title.setTextSize(TypedValue.COMPLEX_UNIT_SP,22); title.setPadding(0,0,0,px(h*0.01f)); box.addView(title);
                  AlertDialog d = new AlertDialog.Builder(this).setView(box).create();
                  if (found.isEmpty()) { TextView empty = new TextView(this); empty.setText("Nenhum aplicativo escondido"); empty.setTextColor(0xFFCCCCCC); box.addView(empty); }
                  for (Apps.Entry e : found) addMenuButton(box, "＋   " + e.label, () -> { java.util.Set<String> hset = new java.util.HashSet<>(getSharedPreferences("launcher_apps", MODE_PRIVATE).getStringSet("hidden", new java.util.HashSet<>())); hset.remove(e.pkg); getSharedPreferences("launcher_apps", MODE_PRIVATE).edit().putStringSet("hidden", hset).apply(); d.dismiss(); buildDock(); showHiddenApps(); });
                  addMenuButton(box, "Fechar", d::dismiss); d.show(); if (d.getWindow()!=null) { d.getWindow().setBackgroundDrawableResource(android.R.color.transparent); d.getWindow().setLayout((int)(w*0.48f), (int)(h*0.72f)); }
              }

              private void openAppInfo(Apps.Entry e) {
                  try { Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + e.pkg)); startActivity(i); }
                  catch (Exception ex) { Toast.makeText(this, "Informações do aplicativo indisponíveis", Toast.LENGTH_SHORT).show(); }
              }

              // ================= Plano de fundo personalizado =================

              private File customWallpaperFile() {
                  return new File(getFilesDir(), "wallpaper_custom");
              }

              // Tamanho do painel: o maior modo que a TV informa, nunca menor que 3840x2160 (4K da 65PUG7408/78).
              private int[] panelSize() {
                  int pw = TV_W;
                  int ph = TV_H;
                  try {
                      android.view.Display d = getWindowManager().getDefaultDisplay();
                      for (android.view.Display.Mode m : d.getSupportedModes()) {
                          pw = Math.max(pw, m.getPhysicalWidth());
                          ph = Math.max(ph, m.getPhysicalHeight());
                      }
                  } catch (Exception e) {
                      // usa o padrao 4K
                  }
                  // limite de textura da GPU de TVs
                  return new int[] { Math.min(pw, 4096), Math.min(ph, 4096) };
              }

              private void loadWallpaperAtStart() {
                  final File f = customWallpaperFile();
                  if (!f.exists()) {
                      wallView.setImageResource(R.drawable.wallpaper);
                      return;
                  }
                  new Thread(() -> {
                      final Bitmap b = decodeWallpaper(f);
                      runOnUiThread(() -> {
                          if (isDestroyed()) return;
                          if (b != null) wallView.setImageBitmap(b);
                          else wallView.setImageResource(R.drawable.wallpaper);
                      });
                  }).start();
              }

              // Decodifica sem perder qualidade: so reduz quando a imagem e maior que o painel (4K),
              // porque acima disso a TV nao mostra mais detalhe e a memoria nao aguenta 8K inteiro.
              private Bitmap decodeWallpaper(File f) {
                  final int[] panel = panelSize();
                  try {
                      if (Build.VERSION.SDK_INT >= 28) {
                          final int pw = panel[0];
                          return ImageDecoder.decodeBitmap(ImageDecoder.createSource(f), (decoder, info, src) -> {
                              int iw = info.getSize().getWidth();
                              int ih = info.getSize().getHeight();
                              if (iw > pw) {
                                  decoder.setTargetSize(pw, Math.max(1, Math.round((float) ih * pw / iw)));
                              }
                          });
                      }
                      BitmapFactory.Options bounds = new BitmapFactory.Options();
                      bounds.inJustDecodeBounds = true;
                      BitmapFactory.decodeFile(f.getAbsolutePath(), bounds);
                      int sample = 1;
                      while (bounds.outWidth / (sample * 2) >= panel[0]) sample *= 2;
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inSampleSize = sample;
                      return BitmapFactory.decodeFile(f.getAbsolutePath(), o);
                  } catch (Throwable t) {
                      return null;
                  }
              }

              private void pickWallpaper() {
                  Toast.makeText(this, "Escolha uma imagem 16:9, de 1920x1080 até 7680x4320", Toast.LENGTH_LONG).show();
                  Intent open = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  open.addCategory(Intent.CATEGORY_OPENABLE);
                  open.setType("image/*");
                  try {
                      startActivityForResult(open, REQ_WALLPAPER);
                      return;
                  } catch (Exception e) {
                      // tenta o seletor alternativo
                  }
                  Intent get = new Intent(Intent.ACTION_GET_CONTENT);
                  get.addCategory(Intent.CATEGORY_OPENABLE);
                  get.setType("image/*");
                  try {
                      startActivityForResult(get, REQ_WALLPAPER);
                  } catch (Exception e) {
                      Toast.makeText(this, "Esta TV não tem um seletor de arquivos instalado", Toast.LENGTH_LONG).show();
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_WALLPAPER && resultCode == RESULT_OK && data != null && data.getData() != null) {
                      importWallpaper(data.getData());
                  }
              }

              private void importWallpaper(final Uri uri) {
                  Toast.makeText(this, "Aplicando plano de fundo…", Toast.LENGTH_SHORT).show();
                  new Thread(() -> {
                      final File tmp = new File(getFilesDir(), "wallpaper_tmp");
                      final String error = importWallpaperSync(uri, tmp);
                      final Bitmap bmp = error == null ? decodeWallpaper(tmp) : null;
                      if (error == null && bmp != null) {
                          File dst = customWallpaperFile();
                          if (dst.exists()) dst.delete();
                          tmp.renameTo(dst);
                      } else {
                          tmp.delete();
                      }
                      runOnUiThread(() -> {
                          if (error != null) {
                              showWallpaperError(error);
                          } else if (bmp == null) {
                              showWallpaperError("Não foi possível abrir essa imagem.");
                          } else {
                              wallView.setImageBitmap(bmp);
                              Toast.makeText(this, "Plano de fundo alterado", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }).start();
              }

              // Valida o tamanho e copia o arquivo original, byte a byte (sem recomprimir), para a pasta do app.
              // Retorna null se deu certo, ou o texto do erro.
              private String importWallpaperSync(Uri uri, File tmp) {
                  try {
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      try (InputStream in = getContentResolver().openInputStream(uri)) {
                          if (in == null) return "Não foi possível abrir o arquivo.";
                          BitmapFactory.decodeStream(in, null, o);
                      }
                      int iw = o.outWidth;
                      int ih = o.outHeight;
                      if (iw <= 0 || ih <= 0) return "Esse arquivo não é uma imagem válida.";

                      // fotos giradas (EXIF) trocam largura e altura
                      try (InputStream in = getContentResolver().openInputStream(uri)) {
                          if (in != null) {
                              int ori = new ExifInterface(in).getAttributeInt(
                                      ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL);
                              if (ori == 5 || ori == 6 || ori == 7 || ori == 8) {
                                  int t = iw;
                                  iw = ih;
                                  ih = t;
                              }
                          }
                      } catch (Exception ignore) {
                          // sem EXIF: segue normal
                      }

                      String dims = iw + "x" + ih;
                      float ratio = (float) iw / (float) ih;
                      if (Math.abs(ratio / WALL_ASPECT - 1f) > WALL_TOLERANCE) {
                          return "A imagem tem " + dims + " e não está na proporção 16:9 da TV. "
                                  + "Use, por exemplo, 1920x1080, 3840x2160 ou 7680x4320.";
                      }
                      if (iw < WALL_MIN_W || ih < WALL_MIN_H) {
                          return "A imagem (" + dims + ") é pequena demais e ficaria borrada. O mínimo é "
                                  + WALL_MIN_W + "x" + WALL_MIN_H + ".";
                      }
                      if (iw > WALL_MAX_W || ih > WALL_MAX_H) {
                          return "A imagem (" + dims + ") é grande demais. O máximo é "
                                  + WALL_MAX_W + "x" + WALL_MAX_H + " (8K).";
                      }

                      try (InputStream in = getContentResolver().openInputStream(uri);
                           FileOutputStream out = new FileOutputStream(tmp)) {
                          if (in == null) return "Não foi possível abrir o arquivo.";
                          byte[] buf = new byte[1 << 16];
                          int n;
                          while ((n = in.read(buf)) != -1) out.write(buf, 0, n);
                      }
                      return null;
                  } catch (Exception e) {
                      return "Falha ao ler a imagem.";
                  }
              }

              private void showWallpaperError(String msg) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(px(w*0.018f), px(h*0.018f), px(w*0.018f), px(h*0.012f));
